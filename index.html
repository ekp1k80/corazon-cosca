<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón — Estudio anatómico</title>
<style>
:root {
  --bg:#0f1115; --panel:#171a21; --panel2:#1d222b; --text:#eef2f7; --muted:#9aa6b2;
  --accent:#7aa2ff; --border:#2a313d; --shadow:0 12px 32px rgba(0,0,0,.28);
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body { overflow:hidden; }
.app { display:grid; grid-template-columns:290px 1fr; height:100vh; }
.sidebar { background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; }
.brand { padding:20px 18px 15px; border-bottom:1px solid var(--border); }
.brand h1 { font-size:18px; margin:0 0 6px; }
.brand p { color:var(--muted); font-size:12px; margin:0; line-height:1.4; }
.nav { overflow:auto; padding:10px; }
.nav button { width:100%; text-align:left; color:var(--text); background:transparent; border:0; border-radius:9px;
  padding:10px 11px; margin:2px 0; cursor:pointer; font-size:13px; line-height:1.25; }
.nav button:hover { background:var(--panel2); }
.nav button.active { background:#25304a; outline:1px solid #385083; }
.num { color:var(--muted); display:inline-block; width:26px; }
.main { display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0; }
.topbar { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; background:rgba(15,17,21,.94); }
.title { flex:1; min-width:0; }
.title h2 { margin:0; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.title small { color:var(--muted); }
.kbd { font-size:11px; color:var(--muted); }
kbd { border:1px solid var(--border); background:var(--panel2); border-bottom-width:2px; border-radius:5px; padding:2px 5px; color:var(--text); }
.content { display:grid; grid-template-columns:minmax(430px,1.05fr) minmax(380px,.95fr); gap:0; min-height:0; }
.viewer { min-width:0; min-height:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:#0b0d11; }
.stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:18px; overflow:hidden; }
.stage img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; box-shadow:var(--shadow); background:#fff; }
.empty { color:var(--muted); text-align:center; max-width:360px; line-height:1.5; }
.counter { position:absolute; top:14px; right:16px; font-size:12px; padding:5px 8px; border-radius:8px; background:rgba(0,0,0,.65); }
.arrow { position:absolute; top:50%; transform:translateY(-50%); border:1px solid var(--border); background:rgba(20,24,30,.86); color:white;
  width:42px; height:60px; border-radius:9px; cursor:pointer; font-size:24px; }
.arrow:hover { background:#263044; }
.prev { left:14px; } .next { right:14px; }
.thumbs { height:122px; border-top:1px solid var(--border); display:flex; gap:9px; overflow-x:auto; padding:10px 12px; background:var(--panel); }
.thumb { flex:0 0 145px; height:98px; border:2px solid transparent; border-radius:7px; overflow:hidden; cursor:pointer; opacity:.68; background:#fff; }
.thumb.active { border-color:var(--accent); opacity:1; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.text { overflow:auto; min-height:0; padding:28px 34px 80px; background:var(--bg); }
.article { max-width:850px; margin:0 auto; line-height:1.67; }
.article h1,.article h2,.article h3 { line-height:1.25; margin-top:1.5em; }
.article h1:first-child,.article h2:first-child { margin-top:0; }
.article h1 { font-size:28px; }
.article h2 { font-size:22px; border-bottom:1px solid var(--border); padding-bottom:6px; }
.article h3 { font-size:17px; color:#cdd8e7; }
.article p,.article li { font-size:15px; }
.article strong { color:#fff; }
.article code { background:var(--panel2); padding:2px 5px; border-radius:4px; }
.article blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:14px; color:#c5cfda; }
.progress { height:3px; background:#242a34; }
.progress > div { height:100%; background:var(--accent); transition:width .18s ease; }
.mobile-menu { display:none; }
@media (max-width:980px) {
  body { overflow:auto; }
  .app { grid-template-columns:1fr; height:auto; min-height:100vh; }
  .sidebar { position:fixed; z-index:20; inset:0 auto 0 0; width:290px; transform:translateX(-100%); transition:.2s; box-shadow:var(--shadow); }
  .sidebar.open { transform:translateX(0); }
  .mobile-menu { display:inline-flex; }
  .main { min-height:100vh; }
  .content { grid-template-columns:1fr; }
  .viewer { height:62vh; border-right:0; border-bottom:1px solid var(--border); }
  .text { overflow:visible; }
  .kbd { display:none; }
}

/* ===== Responsive + navegación mejorada ===== */
.icon-btn,
.nav-btn {
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  cursor:pointer;
  min-height:40px;
  padding:8px 12px;
  font:inherit;
}
.icon-btn:hover,
.nav-btn:hover { background:#263044; }

.mobile-menu {
  align-items:center;
  justify-content:center;
  width:42px;
  min-width:42px;
  padding:0;
  font-size:20px;
}

.sidebar-close {
  display:none;
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  padding:0;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.sidebar-backdrop {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.52);
  z-index:19;
}

.point-controls {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.point-controls .nav-btn {
  white-space:nowrap;
}

.bottom-nav {
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  border-top:1px solid var(--border);
  background:var(--panel);
}
.bottom-nav .nav-btn {
  flex:1;
  max-width:280px;
}
.bottom-nav .next-point { margin-left:auto; }

@media (max-width: 1180px) {
  .content {
    grid-template-columns:minmax(360px,1fr) minmax(360px,1fr);
  }
  .kbd { display:none; }
}

@media (max-width:980px) {
  html, body { height:auto; min-height:100%; }
  body { overflow:auto; }

  .app {
    display:block;
    min-height:100vh;
    height:auto;
  }

  .sidebar {
    position:fixed;
    z-index:20;
    top:0;
    bottom:0;
    left:0;
    width:min(86vw, 320px);
    transform:translateX(-105%);
    transition:transform .22s ease;
    box-shadow:var(--shadow);
  }
  .sidebar.open { transform:translateX(0); }

  .sidebar-close { display:flex; }
  .sidebar-backdrop.open { display:block; }

  .main {
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar {
    position:sticky;
    top:0;
    z-index:10;
    padding:10px 12px;
  }

  .mobile-menu { display:inline-flex; }

  .title h2 {
    font-size:16px;
    white-space:normal;
    line-height:1.2;
  }

  .title small { font-size:11px; }

  .point-controls {
    display:none;
  }

  .content {
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .viewer {
    height:auto;
    min-height:52vh;
    border-right:0;
    border-bottom:1px solid var(--border);
  }

  .stage {
    min-height:42vh;
    padding:12px;
  }

  .stage img {
    max-height:72vh;
  }

  .arrow {
    width:38px;
    height:52px;
    font-size:22px;
  }

  .prev { left:8px; }
  .next { right:8px; }

  .thumbs {
    height:104px;
    padding:8px;
  }
  .thumb {
    flex-basis:125px;
    height:86px;
  }

  .text {
    overflow:visible;
    padding:22px 18px 90px;
  }

  .article {
    max-width:none;
  }

  .article h1 { font-size:24px; }
  .article h2 { font-size:20px; }
  .article h3 { font-size:17px; }
  .article p,
  .article li { font-size:15px; }

  .bottom-nav {
    position:sticky;
    bottom:0;
    z-index:9;
    padding:10px;
  }
}

@media (max-width:560px) {
  .topbar { gap:8px; }
  .stage { min-height:38vh; }
  .stage img { max-height:60vh; }

  .bottom-nav .nav-btn {
    font-size:13px;
    padding:8px 10px;
  }

  .counter {
    top:8px;
    right:8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior:auto !important; }
  .sidebar { transition:none; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Cerrar menú">✕</button>
    <div class="brand">
      <h1>Corazón · UBA</h1>
      <p>Texto + fotogramas seleccionados de Costarelli</p>
    </div>
    <div class="progress"><div id="progress"></div></div>
    <nav class="nav" id="nav"></nav>

    <section class="content">
      <div class="viewer">
        <div class="stage" id="stage">

          <button class="arrow next" id="nextImg" aria-label="Imagen siguiente">›</button>
          <div class="counter" id="imgCounter"></div>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <article class="text"><div class="article" id="article"></div></article>
    </section>
    <div class="bottom-nav">
      <button class="nav-btn prev-point" id="prevPointBottom" type="button">← Punto anterior</button>
      <button class="nav-btn next-point" id="nextPointBottom" type="button">Punto siguiente →</button>
    </div>
  </main>
</div>

let pointIndex = 0;
let imageIndex = 0;

const nav = document.getElementById('nav');
const pointTitle = document.getElementById('pointTitle');
const pointMeta = document.getElementById('pointMeta');
const article = document.getElementById('article');
const mainImg = document.getElementById('mainImg');
const empty = document.getElementById('empty');
const thumbs = document.getElementById('thumbs');
const imgCounter = document.getElementById('imgCounter');
const prevImg = document.getElementById('prevImg');
const nextImg = document.getElementById('nextImg');
const progress = document.getElementById('progress');
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const sidebarClose = document.getElementById('sidebarClose');
const menuBtn = document.getElementById('menuBtn');
const prevPointTop = document.getElementById('prevPointTop');
const nextPointTop = document.getElementById('nextPointTop');
const prevPointBottom = document.getElementById('prevPointBottom');
const nextPointBottom = document.getElementById('nextPointBottom');

DATA.forEach((p,i) => {
  const b=document.createElement('button');
  b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${p.title}`;
  b.onclick=()=>setPoint(i);
  nav.appendChild(b);
});

function setPoint(i) {
  pointIndex = (i + DATA.length) % DATA.length;
  imageIndex = 0;
  render();
  if (window.innerWidth <= 980) closeSidebar();
}

function setImage(i) {
  const imgs=DATA[pointIndex].images;
  if(!imgs.length) return;
  imageIndex=(i+imgs.length)%imgs.length;
  renderImage();
}

function render() {
  const p=DATA[pointIndex];
  pointTitle.textContent=p.title;
  pointMeta.textContent=`Punto ${pointIndex+1} de ${DATA.length} · ${p.images.length} imagen${p.images.length===1?'':'es'}`;
  article.innerHTML=p.html;
  article.parentElement.scrollTop=0;
  progress.style.width=`${((pointIndex+1)/DATA.length)*100}%`;
  const atFirst = pointIndex === 0;
  const atLast = pointIndex === DATA.length - 1;
  [prevPointTop, prevPointBottom].forEach(b => { b.disabled = atFirst; b.style.opacity = atFirst ? '.45' : '1'; });
  [nextPointTop, nextPointBottom].forEach(b => { b.disabled = atLast; b.style.opacity = atLast ? '.45' : '1'; });
  [...nav.children].forEach((el,i)=>el.classList.toggle('active',i===pointIndex));
  nav.children[pointIndex]?.scrollIntoView({block:'nearest'});
  renderImage();
}

function renderImage() {
  const imgs=DATA[pointIndex].images;
  const has=imgs.length>0;
  mainImg.style.display=has?'block':'none';
  empty.style.display=has?'none':'block';
  prevImg.style.display=imgs.length>1?'block':'none';
  nextImg.style.display=imgs.length>1?'block':'none';
  imgCounter.style.display=has?'block':'none';
  thumbs.style.display=imgs.length>1?'flex':'none';
  if(!has) { thumbs.innerHTML=''; return; }
  mainImg.src=imgs[imageIndex];
  mainImg.alt=DATA[pointIndex].title;
  imgCounter.textContent=`${imageIndex+1} / ${imgs.length}`;
  thumbs.innerHTML='';
  imgs.forEach((src,i)=>{
    const d=document.createElement('div');
    d.className='thumb'+(i===imageIndex?' active':'');
    const im=document.createElement('img');
    im.src=src; im.alt=`Imagen ${i+1}`;
    d.appendChild(im); d.onclick=()=>setImage(i); thumbs.appendChild(d);
  });
  thumbs.children[imageIndex]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

prevImg.onclick=()=>setImage(imageIndex-1);
nextImg.onclick=()=>setImage(imageIndex+1);

function openSidebar() {
  sidebar.classList.add('open');
  sidebarBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
  document.body.style.overflow = '';
}
menuBtn.onclick = openSidebar;
sidebarClose.onclick = closeSidebar;
sidebarBackdrop.onclick = closeSidebar;

prevPointTop.onclick = () => { if (pointIndex > 0) setPoint(pointIndex - 1); };
nextPointTop.onclick = () => { if (pointIndex < DATA.length - 1) setPoint(pointIndex + 1); };
prevPointBottom.onclick = () => { if (pointIndex > 0) setPoint(pointIndex - 1); };
nextPointBottom.onclick = () => { if (pointIndex < DATA.length - 1) setPoint(pointIndex + 1); };


document.addEventListener('keydown', e => {
  // Don't hijack keyboard if browser focus is in an editable element.
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='Escape' && sidebar.classList.contains('open')) {
    e.preventDefault(); closeSidebar(); return;
  }
  if(e.code==='Space') {
    e.preventDefault();
    setPoint(pointIndex + (e.shiftKey ? -1 : 1));
  } else if(e.key==='ArrowRight' || e.key==='ArrowDown') {
    e.preventDefault(); setImage(imageIndex+1);
  } else if(e.key==='ArrowLeft' || e.key==='ArrowUp') {
    e.preventDefault(); setImage(imageIndex-1);
  } else if(e.key==='Home') {
    e.preventDefault(); setPoint(0);
  } else if(e.key==='End') {
    e.preventDefault(); setPoint(DATA.length-1);
  }
});
render();
</script>
</body>
</html>
