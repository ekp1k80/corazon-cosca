", "images": []}, {"id": "15_Drenaje_linfatico", "number": 15, "title": "Drenaje linfático", "md_file": "15_Drenaje_linfatico/Nodos_y_drenaje_linfatico_corazon_y_pericardio.md", "html": "<h1>Nodos y drenaje linfático del corazón y del pericardio<\/h1>
<h2>1. Linfáticos del corazón<\/h2>
<p>Latarjet distingue tres redes linfáticas:<\/p>
<ul>
<li><strong>subendocárdica<\/strong>;<\/li>
<li><strong>intramiocárdica<\/strong>;<\/li>
<li><strong>subepicárdica<\/strong>.<\/li>
<\/ul>
<p>La red intramiocárdica está formada por capilares ampliamente anastomosados, pero la red subepicárdica es la que puede describirse anatómicamente con mayor precisión.<\/p>
<p>De la red subepicárdica parten <strong>dos colectores principales: izquierdo y derecho<\/strong>.<\/p>
<h3>Colector principal izquierdo<\/h3>
<blockquote>
<p><strong>El colector principal izquierdo reúne los troncos del territorio izquierdo, relacionados con el surco coronario y el surco interventricular anterior. Sigue el borde izquierdo del tronco pulmonar, emerge por la región posterosuperior de la base cardíaca y termina en los nodos traqueobronquiales inferiores.<\/strong><\/p>
<\/blockquote>
<p>Rouvière lo describe de manera equivalente: asciende por la <strong>cara pulmonar izquierda<\/strong>, pasa posteriormente al <strong>tronco pulmonar<\/strong> y termina en un <strong>nodo traqueobronquial inferior<\/strong>.<\/p>
<h3>Colector principal derecho<\/h3>
<blockquote>
<p><strong>El colector principal derecho se origina principalmente en el territorio derecho del corazón, recorre la porción derecha del surco coronario, pasa entre la aorta y el tronco pulmonar y luego anteriormente a la aorta, para terminar en los nodos mediastínicos anteriores.<\/strong><\/p>
<\/blockquote>
<p>Rouvière agrega que acompaña inicialmente a la <strong>arteria coronaria derecha<\/strong> y termina habitualmente en un nodo del <strong>grupo mediastínico anterior izquierdo<\/strong>.<\/p>
<h3>Nodos epicárdicos<\/h3>
<p>Rouvière menciona además que pueden existir <strong>uno a tres pequeños nodos linfáticos epicárdicos<\/strong>, ubicados a lo largo de los colectores principales en relación con los troncos aórtico y pulmonar.<\/p>
<h3>Speech de corazón<\/h3>
<blockquote>
<p><strong>Los linfáticos del corazón forman redes subendocárdicas, intramiocárdicas y subepicárdicas. De la red subepicárdica parten dos colectores principales. El izquierdo sigue la región del surco coronario e interventricular anterior, asciende junto al tronco pulmonar y termina en los nodos traqueobronquiales inferiores. El colector derecho reúne principalmente la linfa del corazón derecho, acompaña inicialmente a la coronaria derecha, pasa entre la aorta y el tronco pulmonar y luego anteriormente a la aorta, terminando en los nodos mediastínicos anteriores.<\/strong><\/p>
<\/blockquote>
<hr />
<h1>2. Linfáticos del pericardio<\/h1>
<p>Rouvière describe que los vasos linfáticos del pericardio se dirigen a:<\/p>
<ul>
<li><strong>nodos mediastínicos anteriores<\/strong>;<\/li>
<li><strong>nodos mediastínicos posteriores<\/strong>;<\/li>
<li><strong>nodos frénicos<\/strong>;<\/li>
<li><strong>nodos traqueobronquiales inferiores<\/strong>.<\/li>
<\/ul>
<h2>Nodos frénicos superiores<\/h2>
<p>Son especialmente importantes porque se sitúan alrededor de la <strong>base del pericardio<\/strong> y reciben linfáticos del propio pericardio.<\/p>
<p>Se dividen en:<\/p>
<ul>
<li><strong>nodos prepericárdicos<\/strong>, anteriores;<\/li>
<li><strong>nodos pericárdicos laterales<\/strong>, próximos a los nervios frénicos y, del lado derecho, a la vena cava inferior.<\/li>
<\/ul>
<p>Sus eferentes se dirigen principalmente hacia:<\/p>
<ul>
<li><strong>nodos paraesternales<\/strong>;<\/li>
<li><strong>nodos mediastínicos anteriores<\/strong>.<\/li>
<\/ul>
<h3>Speech de pericardio<\/h3>
<blockquote>
<p><strong>Los vasos linfáticos del pericardio drenan hacia cuatro grupos principales: nodos mediastínicos anteriores, mediastínicos posteriores, frénicos y traqueobronquiales inferiores. Entre los frénicos superiores se encuentran nodos prepericárdicos y pericárdicos laterales, situados alrededor de la base del pericardio; sus eferentes alcanzan principalmente nodos paraesternales y mediastínicos anteriores.<\/strong><\/p>
<\/blockquote>
<hr />
<h1>Speech integrado<\/h1>
<blockquote>
<p><strong>El drenaje linfático cardíaco comienza en redes subendocárdicas, intramiocárdicas y subepicárdicas. De la red subepicárdica parten dos colectores principales. El izquierdo asciende en relación con el tronco pulmonar y termina en los nodos traqueobronquiales inferiores; el derecho acompaña inicialmente a la coronaria derecha, pasa entre la aorta y el tronco pulmonar y luego anteriormente a la aorta, para terminar en nodos mediastínicos anteriores. El pericardio, en cambio, drena hacia nodos mediastínicos anteriores y posteriores, frénicos y traqueobronquiales inferiores. Los nodos frénicos superiores, ubicados alrededor de la base pericárdica, incluyen grupos prepericárdicos y pericárdicos laterales.<\/strong><\/p>
<\/blockquote>
<h2>Regla mental<\/h2>
<p><strong>Corazón → dos colectores: izquierdo a traqueobronquiales inferiores; derecho a mediastínicos anteriores.<\/strong><\/p>
<p><strong>Pericardio → mediastínicos + frénicos + traqueobronquiales inferiores.<\/strong><\/p>

let pointIndex = 0;
let imageIndex = 0;

const nav = document.getElementById('nav');
const pointTitle = document.getElementById('pointTitle');
const pointMeta = document.getElementById('pointMeta');
const article = document.getElementById('article');
const mainImg = document.getElementById('mainImg');
const empty = document.getElementById('empty');
const thumbs = document.getElementById('thumbs');
const imgCounter = document.getElementById('imgCounter');
const prevImg = document.getElementById('prevImg');
const nextImg = document.getElementById('nextImg');
const progress = document.getElementById('progress');
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const sidebarClose = document.getElementById('sidebarClose');
const menuBtn = document.getElementById('menuBtn');
const prevPointTop = document.getElementById('prevPointTop');
const nextPointTop = document.getElementById('nextPointTop');
const prevPointBottom = document.getElementById('prevPointBottom');
const nextPointBottom = document.getElementById('nextPointBottom');

DATA.forEach((p,i) => {
  const b=document.createElement('button');
  b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${p.title}`;
  b.onclick=()=>setPoint(i);
  nav.appendChild(b);
});

function setPoint(i) {
  pointIndex = (i + DATA.length) % DATA.length;
  imageIndex = 0;
  render();
  if (window.innerWidth <= 980) closeSidebar();
}

function setImage(i) {
  const imgs=DATA[pointIndex].images;
  if(!imgs.length) return;
  imageIndex=(i+imgs.length)%imgs.length;
  renderImage();
}

function render() {
  const p=DATA[pointIndex];
  pointTitle.textContent=p.title;
  pointMeta.textContent=`Punto ${pointIndex+1} de ${DATA.length} · ${p.images.length} imagen${p.images.length===1?'':'es'}`;
  article.innerHTML=p.html;
  article.parentElement.scrollTop=0;
  progress.style.width=`${((pointIndex+1)/DATA.length)*100}%`;
  const atFirst = pointIndex === 0;
  const atLast = pointIndex === DATA.length - 1;
  [prevPointTop, prevPointBottom].forEach(b => { b.disabled = atFirst; b.style.opacity = atFirst ? '.45' : '1'; });
  [nextPointTop, nextPointBottom].forEach(b => { b.disabled = atLast; b.style.opacity = atLast ? '.45' : '1'; });
  [...nav.children].forEach((el,i)=>el.classList.toggle('active',i===pointIndex));
  nav.children[pointIndex]?.scrollIntoView({block:'nearest'});
  renderImage();
}

function renderImage() {
  const imgs=DATA[pointIndex].images;
  const has=imgs.length>0;
  mainImg.style.display=has?'block':'none';
  empty.style.display=has?'none':'block';
  prevImg.style.display=imgs.length>1?'block':'none';
  nextImg.style.display=imgs.length>1?'block':'none';
  imgCounter.style.display=has?'block':'none';
  thumbs.style.display=imgs.length>1?'flex':'none';
  if(!has) { thumbs.innerHTML=''; return; }
  mainImg.src=imgs[imageIndex];
  mainImg.alt=DATA[pointIndex].title;
  imgCounter.textContent=`${imageIndex+1} / ${imgs.length}`;
  thumbs.innerHTML='';
  imgs.forEach((src,i)=>{
    const d=document.createElement('div');
    d.className='thumb'+(i===imageIndex?' active':'');
    const im=document.createElement('img');
    im.src=src; im.alt=`Imagen ${i+1}`;
    d.appendChild(im); d.onclick=()=>setImage(i); thumbs.appendChild(d);
  });
  thumbs.children[imageIndex]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

prevImg.onclick=()=>setImage(imageIndex-1);
nextImg.onclick=()=>setImage(imageIndex+1);

function openSidebar() {
  sidebar.classList.add('open');
  sidebarBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
  document.body.style.overflow = '';
}
menuBtn.onclick = openSidebar;
sidebarClose.onclick = closeSidebar;
sidebarBackdrop.onclick = closeSidebar;

prevPointTop.onclick = () => { if (pointIndex > 0) setPoint(pointIndex - 1); };
nextPointTop.onclick = () => { if (pointIndex < DATA.length - 1) setPoint(pointIndex + 1); };
prevPointBottom.onclick = () => { if (pointIndex > 0) setPoint(pointIndex - 1); };
nextPointBottom.onclick = () => { if (pointIndex < DATA.length - 1) setPoint(pointIndex + 1); };


document.addEventListener('keydown', e => {
  // Don't hijack keyboard if browser focus is in an editable element.
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='Escape' && sidebar.classList.contains('open')) {
    e.preventDefault(); closeSidebar(); return;
  }
  if(e.code==='Space') {
    e.preventDefault();
    setPoint(pointIndex + (e.shiftKey ? -1 : 1));
  } else if(e.key==='ArrowRight' || e.key==='ArrowDown') {
    e.preventDefault(); setImage(imageIndex+1);
  } else if(e.key==='ArrowLeft' || e.key==='ArrowUp') {
    e.preventDefault(); setImage(imageIndex-1);
  } else if(e.key==='Home') {
    e.preventDefault(); setPoint(0);
  } else if(e.key==='End') {
    e.preventDefault(); setPoint(DATA.length-1);
  }
});
render();
</script>
