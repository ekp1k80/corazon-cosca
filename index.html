.viewer { min-width:0; min-height:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:#0b0d11; }
.stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:18px; overflow:hidden; }
.stage img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; box-shadow:var(--shadow); background:#fff; }
.empty { color:var(--muted); text-align:center; max-width:360px; line-height:1.5; }
.counter { position:absolute; top:14px; right:16px; font-size:12px; padding:5px 8px; border-radius:8px; background:rgba(0,0,0,.65); }
.arrow { position:absolute; top:50%; transform:translateY(-50%); border:1px solid var(--border); background:rgba(20,24,30,.86); color:white;
  width:42px; height:60px; border-radius:9px; cursor:pointer; font-size:24px; }
.arrow:hover { background:#263044; }
.prev { left:14px; } .next { right:14px; }
.thumbs { height:122px; border-top:1px solid var(--border); display:flex; gap:9px; overflow-x:auto; padding:10px 12px; background:var(--panel); }
.thumb { flex:0 0 145px; height:98px; border:2px solid transparent; border-radius:7px; overflow:hidden; cursor:pointer; opacity:.68; background:#fff; }
.thumb.active { border-color:var(--accent); opacity:1; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.text { overflow:auto; min-height:0; padding:28px 34px 80px; background:var(--bg); }
.article { max-width:850px; margin:0 auto; line-height:1.67; }
.article h1,.article h2,.article h3 { line-height:1.25; margin-top:1.5em; }
.article h1:first-child,.article h2:first-child { margin-top:0; }
.article h1 { font-size:28px; }
.article h2 { font-size:22px; border-bottom:1px solid var(--border); padding-bottom:6px; }
.article h3 { font-size:17px; color:#cdd8e7; }

.article strong { color:#fff; }

<h2>Situación<\/h2>

<p><strong>El corazón está situado en el tórax, en el mediastino inferior, principalmente en el mediastino medio. Se encuentra entre ambos pulmones, superior al diafragma, posterior a la pared esternocondrocostal y anterior a la columna vertebral. Se dispone próximo a la línea mediana, pero se desarrolla predominantemente hacia la izquierda.<\/strong><\/p>

<h2>Concepto<\/h2>
<blockquote>
<p><strong>El pericardio es un saco fibroseroso que envuelve al corazón, a la raíz arterial que sale de él y a las raíces venosas que llegan a él. Está constituido por un pericardio fibroso y un pericardio seroso.<\/strong><\/p>
<\/blockquote>
<h2>Pericardio fibroso<\/h2>
<blockquote>
<p><strong>El pericardio fibroso es la envoltura externa resistente del pericardio. Es una membrana fibrosa gruesa y tiene forma de cono o pirámide hueca, con base inferior aplicada sobre el diafragma y vértice superior relacionado con los grandes vasos. Su cara profunda está tapizada por la lámina parietal del pericardio seroso. Esta lámina parietal es extremadamente delgada y se encuentra unida al pericardio fibroso de manera tan íntima que no puede separarse de él por disección.<\/strong><\/p>
<\/blockquote>
<blockquote>
<p><strong>Su fijación depende principalmente de su continuidad con los grandes vasos y de su adherencia al diafragma.<\/strong><\/p>
<\/blockquote>
<h2>Pericardio seroso<\/h2>
<blockquote>
<p><strong>El pericardio seroso presenta dos láminas: una parietal, extremadamente delgada y adherida íntimamente a la cara profunda del pericardio fibroso, de la que no puede separarse por disección; y una visceral o epicardio, que recubre íntimamente al corazón y parte de los grandes vasos. Entre ambas se encuentra la cavidad pericárdica.<\/strong><\/p>
<\/blockquote>
<h2>Cavidad pericárdica<\/h2>
<blockquote>
<p><strong>La cavidad pericárdica es el espacio virtual comprendido entre las láminas parietal y visceral del pericardio seroso. Contiene una pequeña cantidad de líquido seroso que facilita el deslizamiento durante los movimientos cardíacos.<\/strong><\/p>
<\/blockquote>
<h2>Comportamiento con los vasos coronarios<\/h2>
<blockquote>
<p><strong>Sobre el corazón, la lámina visceral constituye el epicardio. Se encuentra adherida al miocardio, pero se separa de éste a nivel de los vasos coronarios, que quedan situados entre el miocardio y el epicardio.<\/strong><\/p>
<\/blockquote>
<h2>Comportamiento con los grandes vasos<\/h2>
<blockquote>
<p><strong>El pericardio seroso se prolonga desde el corazón sobre los grandes vasos que entran o salen de él. A nivel de las raíces arteriales y venosas, la lámina visceral se refleja y continúa con la lámina parietal, formando la línea de reflexión pericárdica.<\/strong><\/p>
<\/blockquote>
<h2>Seno transverso del pericardio<\/h2>
<blockquote>
<p><strong>El seno transverso del pericardio es un espacio transversal situado entre la raíz arterial y el atrio izquierdo. Se ubica posterior a la aorta ascendente y al tronco pulmonar y anterior al atrio izquierdo.<\/strong><\/p>
<\/blockquote>
<h2>Seno oblicuo del pericardio<\/h2>
<blockquote>
<p><strong>El seno oblicuo del pericardio es un receso situado posterior al corazón, especialmente posterior al atrio izquierdo. Está delimitado lateralmente por las reflexiones pericárdicas relacionadas con las venas pulmonares y comunica inferiormente con el resto de la cavidad pericárdica.<\/strong><\/p>
<\/blockquote>
<h2>Irrigación<\/h2>
<blockquote>
<p><strong>La irrigación del pericardio procede principalmente de las arterias torácicas internas y pericardiofrénicas. Recibe además ramas de las arterias frénicas inferiores y pequeñas ramas bronquiales, esofágicas y mediastínicas.<\/strong><\/p>
<\/blockquote>
<h2>Drenaje venoso<\/h2>
<blockquote>
<p><strong>Las venas posteriores del pericardio drenan hacia el sistema ácigos, mientras que las venas laterales drenan hacia las venas frénicas superiores. Algunas ramas pueden terminar directamente en la vena cava superior o en las venas braquiocefálicas.<\/strong><\/p>
<\/blockquote>
<h2>Linfáticos<\/h2>
<blockquote>
<p><strong>Los vasos linfáticos del pericardio drenan hacia los nodos de las cadenas frénicas, los nodos traqueobronquiales inferiores y los nodos infradiafragmáticos.<\/strong><\/p>
<\/blockquote>
<h2>Inervación<\/h2>
<blockquote>
<p><strong>El pericardio fibroso y la lámina parietal reciben inervación del nervio frénico, de los nervios vagos y de ramos simpáticos cardíacos. La lámina visceral recibe fibras provenientes del plexo subepicárdico, derivado de los plexos pericoronarios.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El pericardio es un saco fibroseroso formado por una porción fibrosa externa y una serosa interna. El pericardio fibroso es una membrana gruesa y resistente. La lámina parietal del pericardio seroso es extremadamente delgada y está unida a su cara profunda de manera tan íntima que no puede separarse por disección. La lámina visceral o epicardio recubre al corazón y deja los vasos coronarios entre ella y el miocardio. Sobre los grandes vasos se refleja para continuarse con la lámina parietal, formando líneas de reflexión que delimitan los senos pericárdicos. El seno transverso se encuentra posterior a la aorta ascendente y al tronco pulmonar y anterior al atrio izquierdo; el seno oblicuo se ubica posterior al atrio izquierdo. El pericardio está irrigado principalmente por ramas de las arterias torácicas internas y pericardiofrénicas; sus linfáticos drenan hacia nodos frénicos, traqueobronquiales inferiores e infradiafragmáticos, y su inervación procede del frénico, vagos y simpático.<\/strong><\/p>
<\/blockquote>
<h2>Fotogramas sugeridos – Costarelli<\/h2>
<blockquote>

<h2>1. Forma general y orientación<\/h2>
<blockquote>
<p><strong>El corazón tiene forma de pirámide triangular. Su eje mayor se orienta oblicuamente en sentido anterior, inferior e izquierdo. La base es posterior y se orienta también hacia la derecha; el vértice se dirige anterior, inferior e izquierdo.<\/strong><\/p>
<\/blockquote>
<blockquote>
<p><strong>En su configuración externa se describen cuatro caras, tres bordes, una base y un vértice.<\/strong><\/p>
<\/blockquote>
<h2>2. Caras<\/h2>
<h3>Cara anterior o esternocostal<\/h3>
<p>Presenta orientación predominantemente <strong>anterior<\/strong>. Está formada principalmente por el <strong>ventrículo derecho<\/strong>, con menor participación del ventrículo izquierdo y del sector atrial superior.<\/p>
<h3>Cara inferior o diafragmática<\/h3>
<p>Presenta orientación <strong>inferior<\/strong> y se aplica sobre el diafragma. Tiene forma triangular. Está formada principalmente por el <strong>ventrículo izquierdo<\/strong>, con menor participación del ventrículo derecho y una porción atrial posterior.<\/p>
<h3>Cara pulmonar izquierda<\/h3>
<p>Presenta orientación <strong>lateral izquierda<\/strong>. Está formada fundamentalmente por el <strong>ventrículo izquierdo<\/strong> y, en su sector posterosuperior, por el <strong>atrio izquierdo<\/strong> y su orejuela.<\/p>
<h3>Cara pulmonar derecha<\/h3>
<p>Corresponde principalmente a la porción convexa de la pared lateral del <strong>atrio derecho<\/strong> y se orienta <strong>lateralmente hacia la derecha<\/strong>.<\/p>
<h2>3. Bordes<\/h2>
<p>Se describen <strong>tres bordes<\/strong>:<\/p>
<ul>
<li><strong>Borde derecho:<\/strong> separa la <strong>cara anterior<\/strong> de la <strong>cara inferior<\/strong>. Es neto y relativamente cortante.<\/li>
<li><strong>Borde superior:<\/strong> separa la <strong>cara anterior<\/strong> de la <strong>cara pulmonar izquierda<\/strong>. Es redondeado y poco marcado.<\/li>
<li><strong>Borde izquierdo:<\/strong> separa la <strong>cara pulmonar izquierda<\/strong> de la <strong>cara inferior<\/strong>. También es redondeado y poco marcado.<\/li>
<li>La <strong>cara pulmonar derecha no presenta un borde definido que la separe de la cara anterior<\/strong>.<\/li>
<\/ul>
<h2>4. Base<\/h2>
<blockquote>
<p><strong>La base del corazón es una verdadera cara posterior. Está formada por las caras posteriores de ambos atrios, con predominio del atrio izquierdo. Es ligeramente convexa en sentido transversal y vertical.<\/strong><\/p>
<\/blockquote>
<p>El <strong>surco interatrial posterior<\/strong> la divide en dos sectores desiguales:<\/p>
<ul>
<li><strong>Sector derecho:<\/strong> corresponde a la cara posterior del atrio derecho. Se relaciona superiormente con el orificio de la vena cava superior e inferiormente con el orificio de la vena cava inferior.<\/li>
<li><strong>Sector izquierdo:<\/strong> corresponde principalmente a la cara posterior del atrio izquierdo y está marcado por la llegada de las <strong>cuatro venas pulmonares<\/strong>.<\/li>
<\/ul>
<blockquote>
<p><strong>La base no corresponde a la salida de los grandes vasos: anatómicamente es la cara posterior predominantemente atrial del corazón.<\/strong><\/p>
<\/blockquote>
<h2>5. Vértice<\/h2>
<blockquote>
<p><strong>El vértice es redondeado y pertenece en su totalidad al ventrículo izquierdo. Se dirige anterior, inferior e izquierdo.<\/strong><\/p>
<\/blockquote>
<p>Los surcos interventriculares anterior y posterior se continúan entre sí aproximadamente <strong>1 a 2 cm a la derecha del vértice<\/strong>, formando la escotadura del vértice.<\/p>
<h2>6. Raíz vascular<\/h2>
<p>Comprende:<\/p>
<h3>Componentes arteriales<\/h3>
<ul>
<li>aorta;<\/li>
<li>tronco pulmonar.<\/li>
<\/ul>
<h3>Componentes venosos<\/h3>
<ul>
<li>vena cava superior;<\/li>
<li>vena cava inferior;<\/li>
<li>cuatro venas pulmonares.<\/li>
<\/ul>
<p>Relaciones principales:<\/p>
<ul>
<li>el tronco pulmonar se sitúa <strong>anterior y a la izquierda<\/strong> de la aorta en su origen;<\/li>
<li>la aorta ascendente se sitúa <strong>posterior y a la derecha<\/strong> respecto del tronco pulmonar;<\/li>
<li>las venas pulmonares ocupan predominantemente el sector <strong>posterior<\/strong> de la base;<\/li>
<li>las venas cavas se relacionan con el sector <strong>derecho<\/strong> del atrio derecho.<\/li>
<\/ul>
<h2>7. Surco coronario<\/h2>
<blockquote>
<p><strong>El surco coronario separa externamente el conjunto de los atrios del conjunto de los ventrículos.<\/strong><\/p>
<\/blockquote>
<h3>Contenido relevante<\/h3>
<ul>
<li>En su porción derecha se relaciona con la <strong>arteria coronaria derecha<\/strong>.<\/li>
<li>En su porción izquierda se relaciona con la <strong>rama circunfleja de la arteria coronaria izquierda<\/strong> y con la <strong>vena cardíaca magna<\/strong>.<\/li>
<li>En la región posterior, la vena cardíaca magna continúa con el <strong>seno coronario<\/strong>.<\/li>
<\/ul>
<h2>8. Surco interventricular anterior<\/h2>
<blockquote>
<p><strong>Marca externamente la separación entre ambos ventrículos sobre la cara anterior.<\/strong><\/p>
<\/blockquote>
<p>Contiene principalmente:<\/p>
<ul>
<li><strong>rama interventricular anterior<\/strong> de la arteria coronaria izquierda;<\/li>
<li><strong>vena interventricular anterior<\/strong>, que se continúa con la vena cardíaca magna.<\/li>
<\/ul>
<h2>9. Surco interventricular posterior<\/h2>
<blockquote>
<p><strong>Marca externamente la separación entre ambos ventrículos sobre la cara inferior.<\/strong><\/p>
<\/blockquote>
<p>Contiene principalmente:<\/p>
<ul>
<li><strong>rama interventricular posterior<\/strong>;<\/li>
<li><strong>vena cardíaca media<\/strong>, también denominada vena interventricular posterior.<\/li>
<\/ul>
<h2>10. Correspondencia externa con las cavidades<\/h2>
<ul>
<li><strong>Atrio derecho:<\/strong> sector derecho y mayor parte de la cara pulmonar derecha.<\/li>
<li><strong>Atrio izquierdo:<\/strong> principalmente la base y el sector posterosuperior de la cara pulmonar izquierda.<\/li>
<li><strong>Ventrículo derecho:<\/strong> mayor parte de la cara anterior.<\/li>
<li><strong>Ventrículo izquierdo:<\/strong> mayor parte de la cara inferior y de la cara pulmonar izquierda; forma además todo el vértice.<\/li>
<\/ul>
<h2>11. Orejuela derecha<\/h2>
<blockquote>
<p><strong>Es una prolongación anterior del atrio derecho, relacionada con el sector derecho de la aorta ascendente.<\/strong><\/p>
<\/blockquote>
<h2>12. Orejuela izquierda<\/h2>
<blockquote>
<p><strong>Es una prolongación anterolateral del atrio izquierdo, relacionada con el sector izquierdo del tronco pulmonar y con la cara pulmonar izquierda.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El corazón tiene forma de pirámide triangular y su eje mayor se orienta anterior, inferior e izquierdo. Presenta cuatro caras, tres bordes, una base y un vértice. La cara anterior corresponde principalmente al ventrículo derecho; la cara inferior, principalmente al ventrículo izquierdo; la cara pulmonar izquierda, al ventrículo izquierdo y al atrio izquierdo; y la cara pulmonar derecha, principalmente al atrio derecho. El borde derecho separa las caras anterior e inferior; el borde superior separa la cara anterior de la pulmonar izquierda; y el borde izquierdo separa la cara pulmonar izquierda de la inferior. La base es una verdadera cara posterior, formada por ambos atrios con predominio del izquierdo, y recibe las cuatro venas pulmonares en su sector izquierdo y las venas cavas en su sector derecho. El vértice se dirige anterior, inferior e izquierdo y pertenece por completo al ventrículo izquierdo. El surco coronario separa atrios y ventrículos; los surcos interventriculares anterior y posterior marcan externamente la separación entre ambos ventrículos y contienen los vasos interventriculares correspondientes.<\/strong><\/p>
<\/blockquote>

<h2>Concepto<\/h2>
<blockquote>
<p><strong>Las paredes ventriculares presentan relieves musculares denominados trabéculas carnosas. Rouvière las clasifica en tres órdenes según su relación con la pared ventricular.<\/strong><\/p>
<\/blockquote>
<h2>Primer orden: músculos papilares<\/h2>
<blockquote>
<p><strong>Son relieves musculares unidos por su base a la pared ventricular y con un vértice libre del que se originan cuerdas tendinosas destinadas a las valvas atrioventriculares.<\/strong><\/p>
<\/blockquote>
<h2>Segundo orden<\/h2>
<blockquote>
<p><strong>Se fijan a la pared ventricular por sus dos extremos y permanecen libres en su segmento intermedio.<\/strong><\/p>
<\/blockquote>
<p>La <strong>trabécula septomarginal<\/strong> del ventrículo derecho pertenece a este grupo.<\/p>
<h2>Tercer orden<\/h2>
<blockquote>
<p><strong>Se adhieren a la pared ventricular a lo largo de toda su extensión y constituyen simples relieves musculares de la superficie interna ventricular.<\/strong><\/p>
<\/blockquote>
<h2>No confundir con los órdenes de las cuerdas tendinosas<\/h2>
<p>Las <strong>cuerdas tendinosas<\/strong> poseen otra clasificación distinta:<\/p>
<ol>
<li>primer orden: inserción en el borde adherente de la valva;<\/li>
<li>segundo orden: inserción en la cara parietal;<\/li>
<li>tercer orden: inserción en el borde libre.<\/li>
<\/ol>
<h2>Speech<\/h2>
<blockquote>

<h2>1. Presentación del atrio derecho<\/h2>
<blockquote>
<p><strong>El atrio derecho es una cavidad irregular de paredes delgadas que recibe sangre venosa sistémica y del propio corazón. Presenta los orificios de las venas cavas superior e inferior, del seno coronario y de pequeñas venas cardíacas.<\/strong><\/p>
<\/blockquote>
<h2>2. Surco terminal, cresta terminal y músculos pectíneos<\/h2>
<blockquote>
<p><strong>El surco terminal es un surco de la superficie externa del atrio derecho, casi vertical, ligeramente arqueado y cóncavo hacia la izquierda. Marca externamente el límite entre la porción posterior del atrio incorporada a partir del seno venoso y la porción derivada del atrio primitivo. Su correspondencia interna es la cresta terminal.<\/strong><\/p>
<\/blockquote>
<blockquote>
<p><strong>La cresta terminal es un relieve muscular vertical de la pared interna del atrio derecho. Separa el seno de las venas cavas, de pared lisa y situado posteriormente, del territorio pectíneo, situado anteriormente. Los músculos pectíneos son relieves musculares dirigidos predominantemente en sentido anteroposterior y se continúan hacia la orejuela derecha.<\/strong><\/p>
<\/blockquote>
<h3>Para no confundirlos<\/h3>
<ul>
<li><strong>Surco terminal = externo.<\/strong><\/li>
<li><strong>Cresta terminal = interno.<\/strong><\/li>
<li>Ambos marcan aproximadamente el límite entre dos territorios de distinto origen embrionario: <strong>seno venoso incorporado<\/strong> y <strong>atrio primitivo<\/strong>.<\/li>
<\/ul>
<h3>Significado<\/h3>
<ul>
<li><p><strong>Anatómico:<\/strong> la cresta terminal separa una porción lisa, sinusal, de una porción trabeculada, pectínea.<\/p>
<\/li>
<li><p><strong>Embriológico:<\/strong> separa territorios de distinto origen: la porción sinusal incorporada y la porción derivada del atrio primitivo.<\/p>
<\/li>
<li><p><strong>Funcional:<\/strong> los músculos pectíneos forman parte del miocardio contráctil atrial.<\/p>
<\/li>
<\/ul>
<h2>3. Orejuela derecha<\/h2>
<blockquote>
<p><strong>La orejuela derecha es una prolongación del atrio derecho. Su interior presenta columnas musculares entrecruzadas y se continúa con el territorio de los músculos pectíneos.<\/strong><\/p>
<\/blockquote>
<p>Embriológicamente corresponde principalmente a la porción derivada del atrio primitivo.<\/p>
<h2>4. Orificio de la vena cava superior<\/h2>
<blockquote>
<p><strong>El orificio de la vena cava superior se encuentra en la pared superior del atrio derecho. Presenta una orientación oblicua y carece de una válvula funcional.<\/strong><\/p>
<\/blockquote>
<p>Su función es permitir el ingreso al atrio derecho de la sangre proveniente del territorio supradiafragmático.<\/p>
<h2>5. Orificio de la vena cava inferior<\/h2>
<blockquote>
<p><strong>El orificio de la vena cava inferior se encuentra en la pared inferior del atrio derecho. Está parcialmente rodeado por la válvula de la vena cava inferior, que en el adulto es incompleta y carece de valor funcional apreciable.<\/strong><\/p>
<\/blockquote>
<h3>Significado embriológico<\/h3>
<p>Durante la vida fetal, la válvula de la vena cava inferior participa en la orientación de la corriente sanguínea hacia el foramen oval.<\/p>
<h2>6. Orificio del seno coronario<\/h2>
<blockquote>
<p><strong>El orificio del seno coronario se localiza en la región inferomedial del atrio derecho. Es circular y está limitado por la válvula del seno coronario.<\/strong><\/p>
<\/blockquote>
<p>Funcionalmente permite el retorno al atrio derecho de gran parte de la sangre venosa del propio corazón.<\/p>
<h2>7. Septo interatrial, fosa oval y limbo<\/h2>
<blockquote>
<p><strong>El septo interatrial es la pared que separa el atrio derecho del atrio izquierdo. Está orientado oblicuamente, por lo que el atrio izquierdo no se encuentra solamente a la izquierda del derecho, sino también en una posición más posterior. Desde el atrio derecho, el septo se reconoce como una pared posteromedial.<\/strong><\/p>
<\/blockquote>
<blockquote>
<p><strong>En su centro se encuentra la fosa oval, una depresión muy delgada que corresponde al sector más fino del septo. Está circunscrita por el limbo de la fosa oval, un reborde más grueso que puede ser incompleto, sobre todo en su porción anteroinferior.<\/strong><\/p>
<\/blockquote>
<h3>Significado<\/h3>
<ul>
<li><p><strong>Anatómico:<\/strong> constituye la separación entre ambas cavidades atriales.<\/p>
<\/li>
<li><p><strong>Embriológico:<\/strong> la fosa oval representa el vestigio del foramen oval fetal; el limbo corresponde al reborde que circunscribe esa región.<\/p>
<\/li>
<li><p><strong>Funcional fetal:<\/strong> el foramen oval permitía el pasaje de sangre del atrio derecho al atrio izquierdo.<\/p>
<\/li>
<li><p><strong>En el adulto:<\/strong> normalmente queda cerrado; la persistencia de comunicaciones en esta región puede dar lugar a comunicaciones interatriales.<\/p>
<\/li>
<\/ul>
<h3>Cierre del foramen oval al nacimiento<\/h3>
<blockquote>
<p><strong>Durante la vida fetal, la corriente sanguínea mantiene la válvula del foramen oval desplazada hacia el atrio izquierdo y permite el cortocircuito de derecha a izquierda. Al nacimiento, cuando se establece la respiración pulmonar, la presión del atrio izquierdo supera a la del atrio derecho. Esto aplica la prolongación del septum primum contra la cara izquierda del septum secundum y produce el cierre funcional del foramen oval; posteriormente puede producirse su soldadura anatómica.<\/strong><\/p>
<\/blockquote>
<p><strong>Importante:<\/strong> el corazón fetal ya late mucho antes del nacimiento. Lo que cambia con las primeras respiraciones no es que el corazón “empiece a latir”, sino el régimen circulatorio: comienza la circulación pulmonar efectiva y se invierte el gradiente de presión entre los atrios.<\/p>
<h2>8. Orificio atrioventricular derecho y válvula tricúspide<\/h2>
<blockquote>
<p><strong>El orificio atrioventricular derecho comunica el atrio derecho con el ventrículo derecho y está provisto de la válvula atrioventricular derecha o tricúspide. El aparato tricuspídeo comprende el anillo fibroso, tres valvas principales, las cuerdas tendinosas y los músculos papilares. Funcionalmente asegura la apertura del orificio durante la diástole y su cierre durante la sístole.<\/strong><\/p>
<\/blockquote>
<h3>Valvas de la tricúspide<\/h3>
<p>La válvula posee <strong>tres valvas principales<\/strong>, relacionadas con las paredes del ventrículo:<\/p>
<ul>
<li><strong>Valva anterior:<\/strong> es la más amplia; se inserta en la porción anterior del anillo.<\/li>
<li><strong>Valva posterior:<\/strong> es menor y se inserta en la porción posterior e inferior del anillo.<\/li>
<li><strong>Valva septal:<\/strong> es pequeña y se inserta sobre el septo interventricular, en relación con la porción membranosa.<\/li>
<\/ul>
<p>Entre ellas existen <strong>tres comisuras<\/strong>: lateral, posteromedial y anteromedial.<\/p>
<h3>Cuerdas tendinosas y músculos papilares<\/h3>
<ul>
<li>El <strong>músculo papilar anterior<\/strong> envía la mayor parte de sus cuerdas a la <strong>valva anterior<\/strong> y algunas a la <strong>valva posterior<\/strong>.<\/li>
<li>La pared inferior origina <strong>uno o dos músculos papilares<\/strong>, cuyas cuerdas llegan a la <strong>valva posterior<\/strong> y al extremo inferior de la <strong>valva septal<\/strong>.<\/li>
<li>La mayor parte de las cuerdas de la <strong>valva septal<\/strong> nace de la pared septal, directamente o mediante pequeños músculos papilares.<\/li>
<li>Uno de los <strong>músculos papilares septales<\/strong>, constante y situado próximo al cono arterial, emite <strong>cinco o seis cuerdas tendinosas<\/strong>, que terminan en la porción superior de la valva septal y, principalmente, en la porción medial de la valva anterior.<\/li>
<\/ul>
<h3>Órdenes de las cuerdas<\/h3>
<p>Según su sitio de inserción, las cuerdas se clasifican en:<\/p>
<ol>
<li><strong>Primer orden:<\/strong> borde adherente.<\/li>
<li><strong>Segundo orden:<\/strong> cara parietal de la valva.<\/li>
<li><strong>Tercer orden:<\/strong> borde libre.<\/li>
<\/ol>
<p><strong>No existe en Rouvière ni en Latarjet un número total fijo de cuerdas para cada valva.<\/strong> El dato numérico constante que sí describe Rouvière es el de las <strong>cinco o seis cuerdas del músculo papilar septal constante situado próximo al cono arterial<\/strong>.<\/p>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El atrio derecho es una cavidad de paredes delgadas que recibe las venas cavas superior e inferior y el seno coronario. Su superficie interna presenta una porción sinusal lisa y una porción pectínea, separadas por la cresta terminal, que representa internamente al surco terminal. Los músculos pectíneos ocupan la pared anterolateral y se continúan hacia la orejuela derecha. En la pared superior se encuentra el orificio de la vena cava superior; en la inferior, el de la vena cava inferior, parcialmente rodeado por la válvula de la vena cava inferior, y medialmente el orificio del seno coronario con su válvula del seno coronario. La pared posteromedial corresponde al septo interatrial, que separa ambos atrios y presenta en su centro la fosa oval, una depresión muy delgada circunscrita por el limbo de la fosa oval; esta región representa el vestigio del foramen oval fetal. Finalmente, el atrio se comunica con el ventrículo derecho por el orificio atrioventricular derecho, provisto de la válvula tricúspide.<\/strong><\/p>

<h2>Programa<\/h2>
<ul>
<li>Orificio atrioventricular derecho.<\/li>
<li>Aparato de la válvula atrioventricular derecha.<\/li>
<li>Septo interventricular: porciones muscular y membranosa.<\/li>
<li>Septo atrioventricular.<\/li>
<li>Cresta supraventricular.<\/li>
<li>Porciones infracrestínea y supracrestínea.<\/li>
<li>Trabécula septomarginal.<\/li>
<li>Cono arterioso.<\/li>
<li>Válvula pulmonar.<\/li>
<li>Cámaras de entrada y salida.<\/li>
<li>Significado anatómico, funcional y embriológico.<\/li>
<\/ul>
<h2>1. Presentación<\/h2>
<blockquote>
<p><strong>El ventrículo derecho tiene forma de pirámide triangular. Presenta paredes anterior, inferior y medial, un vértice y una base. Rouvière describe un espesor aproximado de 5 mm para sus paredes.<\/strong><\/p>
<\/blockquote>
<p>La pared medial corresponde al <strong>septo interventricular<\/strong>. En sus paredes se encuentran numerosas trabéculas carnosas.<\/p>
<h2>2. Orificio atrioventricular derecho y aparato valvular<\/h2>
<blockquote>
<p><strong>El orificio atrioventricular derecho comunica el atrio derecho con el ventrículo derecho y está provisto de la válvula atrioventricular derecha o tricúspide. El aparato valvular comprende anillo fibroso, valvas, cuerdas tendinosas y músculos papilares.<\/strong><\/p>
<\/blockquote>
<h3>Valvas<\/h3>
<p>Posee tres valvas principales:<\/p>
<ul>
<li><strong>anterior:<\/strong> la más extensa;<\/li>
<li><strong>posterior:<\/strong> de menor tamaño;<\/li>
<li><strong>septal:<\/strong> relacionada con el septo interventricular y con su porción membranosa.<\/li>
<\/ul>
<p>Rouvière describe además pequeñas valvas accesorias inconstantes.<\/p>
<h3>Músculos papilares y cuerdas<\/h3>
<ul>
<li>El <strong>músculo papilar anterior<\/strong> envía cuerdas principalmente a la valva anterior y también a la posterior.<\/li>
<li>Uno o dos <strong>músculos papilares posteriores<\/strong> relacionados con la pared inferior envían cuerdas a la valva posterior y al extremo inferior de la valva septal.<\/li>
<li>La mayor parte de las cuerdas de la <strong>valva septal<\/strong> procede directamente de la pared septal o de pequeños músculos papilares septales.<\/li>
<li>Uno de los <strong>músculos papilares septales<\/strong>, constante y situado próximo al cono arterial, emite <strong>cinco o seis cuerdas tendinosas<\/strong> hacia la porción superior de la valva septal y principalmente hacia la porción medial de la valva anterior.<\/li>
<\/ul>
<h3>Órdenes de las cuerdas tendinosas<\/h3>
<ol>
<li><strong>Primer orden:<\/strong> borde adherente de la valva.<\/li>
<li><strong>Segundo orden:<\/strong> cara parietal.<\/li>
<li><strong>Tercer orden:<\/strong> borde libre.<\/li>
<\/ol>
<blockquote>
<p><strong>Latarjet y Rouvière no establecen un número total fijo de cuerdas para cada valva. El dato numérico específico que Rouvière individualiza es el de cinco o seis cuerdas procedentes del músculo papilar septal constante situado próximo al cono arterial.<\/strong><\/p>
<\/blockquote>
<h2>3. Septo interventricular<\/h2>
<blockquote>
<p><strong>Separa ambos ventrículos y presenta una amplia porción muscular y una pequeña porción membranosa.<\/strong><\/p>
<\/blockquote>
<ul>
<li><strong>Anatómico:<\/strong> separa las cavidades ventriculares.<\/li>
<li><strong>Funcional:<\/strong> mantiene separadas las corrientes de ambos ventrículos y se relaciona con el sistema de conducción.<\/li>
<li><strong>Embriológico:<\/strong> Rouvière describe una formación compleja en la que intervienen el septo muscular inferior y componentes del septo atrioventricular y de la tabicación de la vía de salida. La bibliografía oficial no permite reducir toda la porción membranosa a un único origen.<\/li>
<\/ul>
<h2>4. Septo atrioventricular<\/h2>
<blockquote>
<p><strong>Debido al diferente nivel de inserción de las válvulas atrioventriculares, existe una región septal que separa directamente el atrio derecho del ventrículo izquierdo.<\/strong><\/p>
<\/blockquote>
<p>Se relaciona estrechamente con el fascículo atrioventricular del sistema de conducción.<\/p>
<h2>5. Cresta supraventricular<\/h2>
<blockquote>
<p><strong>Es un relieve muscular de la porción superior del ventrículo derecho que se origina en el septo interventricular y se prolonga hacia la pared anterior. Participa en la separación topográfica entre la región de entrada y la región de salida.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> la bibliografía oficial describe su anatomía dentro de la morfología ventricular, pero <strong>no individualiza un origen embrionario propio de la cresta supraventricular<\/strong>.<\/p>
<h2>6. Porciones infracrestínea y supracrestínea<\/h2>
<blockquote>
<p><strong>La cresta supraventricular permite reconocer una región infracrestínea vinculada con el sector de entrada y una región supracrestínea vinculada con la vía de salida.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> la bibliografía oficial <strong>no individualiza un origen embrionario propio para cada una de estas dos porciones<\/strong>.<\/p>
<h2>7. Trabécula septomarginal<\/h2>
<blockquote>
<p><strong>Es una trabécula carnosa de segundo orden que une la pared septal con la región del músculo papilar anterior. En su espesor se relaciona con la rama derecha del fascículo atrioventricular.<\/strong><\/p>
<\/blockquote>
<ul>
<li><strong>Anatómico:<\/strong> une regiones septal y anterior del ventrículo derecho.<\/li>
<li><strong>Funcional:<\/strong> constituye un trayecto relacionado con la distribución de la rama derecha del sistema de conducción.<\/li>
<li><strong>Embriológico:<\/strong> forma parte de la remodelación de la red trabecular ventricular; la bibliografía oficial no individualiza un origen embrionario independiente.<\/li>
<\/ul>
<h2>8. Cono arterioso<\/h2>
<blockquote>
<p><strong>Es la porción de salida del ventrículo derecho, de paredes relativamente lisas, que termina superiormente en el orificio del tronco pulmonar.<\/strong><\/p>
<\/blockquote>
<ul>
<li><strong>Anatómico:<\/strong> constituye el segmento terminal de la vía de salida.<\/li>
<li><strong>Funcional:<\/strong> conduce la sangre hacia el tronco pulmonar.<\/li>
<li><strong>Embriológico:<\/strong> se relaciona con la región bulbar y con la tabicación de la vía de salida descrita durante el desarrollo cardíaco.<\/li>
<\/ul>
<h2>9. Válvula pulmonar<\/h2>
<blockquote>
<p><strong>La válvula pulmonar se sitúa en el orificio del tronco pulmonar y posee tres valvas semilunares: anterior, derecha e izquierda.<\/strong><\/p>
<\/blockquote>
<ul>
<li>Durante la <strong>sístole ventricular<\/strong>, las valvas se aplican contra la pared arterial y permiten la apertura del orificio.<\/li>
<li>Durante la <strong>diástole<\/strong>, las valvas se aproximan entre sí y cierran el orificio, impidiendo el retorno hacia el ventrículo.<\/li>
<\/ul>
<p><strong>Embriología:<\/strong> las valvas semilunares se desarrollan durante la tabicación del bulbo cardíaco y la separación de las vías aórtica y pulmonar.<\/p>
<h2>10. Cámara de entrada<\/h2>
<blockquote>
<p><strong>La cámara de entrada se sitúa posteroinferiormente respecto de la cámara de salida, se relaciona con el orificio atrioventricular derecho y posee paredes irregulares con músculos papilares y trabéculas carnosas.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> la bibliografía oficial <strong>no individualiza un origen embrionario propio de la cámara de entrada como estructura adulta separada<\/strong>.<\/p>
<h2>11. Cámara de salida<\/h2>
<blockquote>
<p><strong>La cámara de salida se sitúa anterosuperiormente respecto de la cámara de entrada, presenta paredes más lisas y continúa superiormente con el cono arterioso y la válvula pulmonar.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> la bibliografía oficial relaciona la morfogénesis de la vía de salida con la región bulbar, pero <strong>no individualiza un origen embrionario propio de la cámara de salida como unidad adulta separada<\/strong>.<\/p>
<h2>12. Comparación de espesor con el ventrículo izquierdo<\/h2>
<blockquote>
<p><strong>Rouvière describe un espesor aproximado de 5 mm para las paredes del ventrículo derecho y de 1 cm para las paredes del ventrículo izquierdo. La circulación pulmonar funciona a una presión mucho menor que la circulación sistémica.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El ventrículo derecho tiene forma de pirámide triangular y presenta paredes anterior, inferior y medial, vértice y base; sus paredes miden aproximadamente 5 mm. El orificio atrioventricular derecho está provisto de la válvula tricúspide, con valvas anterior, posterior y septal, cuerdas tendinosas y músculos papilares. El septo interventricular posee porciones muscular y membranosa y se relaciona con el septo atrioventricular y el sistema de conducción. La cresta supraventricular organiza topográficamente los sectores de entrada y salida. La trabécula septomarginal es una trabécula de segundo orden relacionada con la rama derecha del fascículo atrioventricular. La vía de salida continúa con el cono arterioso y termina en la válvula pulmonar, cuyas valvas semilunares son anterior, derecha e izquierda. La cámara de entrada es posteroinferior y trabeculada, mientras que la cámara de salida es anterosuperior y de paredes más lisas.<\/strong><\/p>
<\/blockquote>

<h2>Programa<\/h2>
<p>El programa exige estudiar en el atrio izquierdo:<\/p>
<ul>
<li>Orificios de las venas pulmonares.<\/li>
<li>Orejuela izquierda.<\/li>
<li>Orificio atrioventricular izquierdo.<\/li>
<li>Válvula atrioventricular izquierda o mitral.<\/li>
<li>Septo interatrial.<\/li>
<li>Significado anatómico, funcional y embriológico de cada estructura.<\/li>
<\/ul>
<h2>1. Presentación del atrio izquierdo<\/h2>
<blockquote>
<p><strong>El atrio izquierdo es una cavidad de eje mayor transversal, situada a la izquierda y posteriormente respecto del atrio derecho. Recibe las cuatro venas pulmonares y se comunica con el ventrículo izquierdo por el orificio atrioventricular izquierdo, provisto de la válvula mitral.<\/strong><\/p>
<\/blockquote>
<h2>2. Orificios de las venas pulmonares<\/h2>
<blockquote>
<p><strong>Anatómicamente, en la pared posterior del atrio izquierdo desembocan cuatro venas pulmonares, dos derechas y dos izquierdas, cuyos orificios carecen de válvulas. Funcionalmente, constituyen la vía de llegada de la sangre proveniente de la circulación pulmonar al corazón izquierdo. Embriológicamente, la pared posterior lisa del atrio izquierdo se forma por incorporación progresiva del tronco venoso pulmonar y de sus ramas a la pared atrial.<\/strong><\/p>
<\/blockquote>
<h3>Idea clave embriológica<\/h3>
<p>Inicialmente desemboca un tronco venoso pulmonar común. A medida que el atrio crece, el tronco y sus ramas proximales se incorporan progresivamente a la pared atrial, de modo que finalmente quedan cuatro orificios venosos pulmonares independientes.<\/p>
<h2>3. Orejuela izquierda<\/h2>
<blockquote>
<p><strong>Anatómicamente, la orejuela izquierda es una prolongación del atrio izquierdo situada en su región superolateral y contiene músculos pectíneos. Funcionalmente, forma parte de la cavidad atrial contráctil y aumenta su capacidad. Embriológicamente, representa principalmente la porción del atrio izquierdo derivada del atrio primitivo, en contraste con la pared lisa relacionada con la incorporación de las venas pulmonares.<\/strong><\/p>
<\/blockquote>
<h3>Idea clave<\/h3>
<ul>
<li>Orejuela izquierda → porción derivada del atrio primitivo.<\/li>
<li>Pared lisa con orificios pulmonares → incorporación de las venas pulmonares.<\/li>
<\/ul>
<h2>4. Orificio atrioventricular izquierdo y válvula mitral<\/h2>
<blockquote>
<p><strong>Anatómicamente, el orificio atrioventricular izquierdo comunica el atrio izquierdo con el ventrículo izquierdo y está provisto de la válvula mitral. Funcionalmente, permite el pasaje de sangre del atrio al ventrículo durante la diástole y se cierra durante la sístole ventricular para impedir el reflujo hacia el atrio. Embriológicamente, el aparato valvular atrioventricular se forma mediante la remodelación de los rodetes endocárdicos y del tejido ventricular relacionado con las valvas, cuerdas tendinosas y músculos papilares.<\/strong><\/p>
<\/blockquote>
<p>La válvula mitral se inserta en el anillo fibroso atrioventricular izquierdo y posee <strong>dos valvas principales<\/strong>:<\/p>
<ul>
<li><strong>Valva anterior o mayor:<\/strong> anteromedial; está frente al septo interventricular y al orificio aórtico, y participa en la separación entre la cámara de entrada y la cámara de salida del ventrículo izquierdo.<\/li>
<li><strong>Valva posterior o menor:<\/strong> posterolateral; corresponde a la pared lateral del ventrículo izquierdo.<\/li>
<\/ul>
<p>Ambas valvas reciben cuerdas tendinosas de los músculos papilares anterior y posterior. La descripción completa del aparato mitral se desarrolla en el archivo de ventrículo izquierdo.<\/p>
<h2>5. Septo interatrial<\/h2>
<blockquote>
<p><strong>Anatómicamente, el septo interatrial es la pared que separa ambos atrios. Presenta una disposición oblicua, de modo que el atrio izquierdo se encuentra no solo a la izquierda sino también en posición posterior respecto del atrio derecho. Desde el atrio izquierdo corresponde a una pared anterior y derecha, muy delgada a nivel de la región correspondiente a la fosa oval del lado derecho y más gruesa en su periferia. Funcionalmente, mantiene separadas las cavidades atriales después del nacimiento. Embriológicamente, resulta del proceso de tabicación del atrio primitivo mediante el desarrollo de septum primum y septum secundum, cuya disposición definitiva se relaciona con la región de la fosa oval.<\/strong><\/p>
<\/blockquote>
<p>En la cara izquierda pueden reconocerse vestigios del septum secundum.<\/p>
<h3>Cierre del foramen oval al nacimiento<\/h3>
<blockquote>
<p><strong>Durante la vida fetal existe un paso de sangre desde el atrio derecho hacia el izquierdo a través del foramen oval. Al nacimiento, cuando se establece la respiración pulmonar, la presión del atrio izquierdo supera a la del atrio derecho. La válvula formada por el septum primum se aplica entonces contra el septum secundum y produce el cierre funcional del foramen oval; posteriormente puede producirse la soldadura anatómica.<\/strong><\/p>
<\/blockquote>
<p><strong>Punto fino:<\/strong> el corazón no comienza a latir con la primera respiración; ya funciona durante la vida fetal. Lo que cambia al nacimiento es la circulación: se establece la circulación pulmonar efectiva y cambia el gradiente de presión entre ambos atrios.<\/p>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El atrio izquierdo es una cavidad de eje mayor transversal situada a la izquierda y posteriormente respecto del atrio derecho. Recibe cuatro venas pulmonares, cuyos orificios carecen de válvulas; anatómicamente constituyen las vías de llegada al atrio, funcionalmente conducen la sangre proveniente de los pulmones y embriológicamente se forman por incorporación progresiva del tronco venoso pulmonar y sus ramas a la pared atrial. La orejuela izquierda contiene músculos pectíneos y representa principalmente la porción derivada del atrio primitivo. El atrio se comunica con el ventrículo izquierdo mediante el orificio atrioventricular izquierdo, provisto de la válvula mitral, que asegura el flujo unidireccional durante el ciclo cardíaco. Finalmente, el septo interatrial separa ambos atrios, explica la posición más posterior del atrio izquierdo y deriva del proceso de tabicación atrial embrionaria.<\/strong><\/p>
<\/blockquote>

<h2>Programa<\/h2>

<li>Aparato de la válvula atrioventricular izquierda o mitral.<\/li>
<li>Valvas anterior y posterior.<\/li>
<li>Músculos papilares anterior y posterior.<\/li>
<li>Cuerdas tendinosas.<\/li>
<li>Septo interventricular: porciones muscular y membranosa.<\/li>
<li>Válvula aórtica.<\/li>
<li>Cámaras de entrada y salida.<\/li>
<li>Significado anatómico, funcional y embriológico.<\/li>
<\/ul>
<h2>1. Presentación<\/h2>
<blockquote>
<p><strong>El ventrículo izquierdo es una cavidad cónica, de sección aproximadamente circular y paredes gruesas. Presenta paredes lateral, inferior y medial o septal, un vértice, una base y el orificio aórtico. Rouvière describe un espesor promedio cercano a 1 cm.<\/strong><\/p>
<\/blockquote>
<h2>2. Orificio atrioventricular izquierdo y aparato mitral<\/h2>
<blockquote>
<p><strong>El orificio atrioventricular izquierdo comunica el atrio izquierdo con el ventrículo izquierdo. Su aparato valvular comprende anillo fibroso, válvula mitral, cuerdas tendinosas y músculos papilares.<\/strong><\/p>
<\/blockquote>
<p>La válvula mitral posee <strong>dos valvas principales<\/strong>, anterior y posterior.<\/p>
<h2>3. Valva anterior<\/h2>
<ul>
<li>Se sitúa <strong>anteromedialmente<\/strong> respecto de la valva posterior.<\/li>
<li>Es ligeramente mayor.<\/li>
<li>Se relaciona con el <strong>septo interventricular<\/strong> y con el <strong>orificio aórtico<\/strong>.<\/li>
<li>Participa en la separación entre la cámara de entrada y la cámara de salida.<\/li>
<li>Según Rouvière, sus cuerdas son <strong>de tercer orden<\/strong> y se fijan en el <strong>borde libre<\/strong>, por lo que su cara parietal permanece lisa.<\/li>
<\/ul>
<h2>4. Valva posterior<\/h2>
<ul>
<li>Se sitúa <strong>posterolateralmente<\/strong> respecto de la anterior.<\/li>
<li>Corresponde a la pared lateral del ventrículo izquierdo.<\/li>
<li>Recibe numerosas cuerdas tendinosas sobre su cara parietal, desde el borde libre hacia el borde adherente.<\/li>
<\/ul>
<h2>5. Músculos papilares<\/h2>
<p>Existen dos músculos papilares principales:<\/p>
<ul>
<li><strong>anterior<\/strong>;<\/li>
<li><strong>posterior<\/strong>.<\/li>
<\/ul>
<p>Ambos envían cuerdas a <strong>las dos valvas<\/strong>.<\/p>
<ul>
<li>Las cuerdas del músculo papilar anterior se dirigen a la <strong>mitad superior de ambas valvas<\/strong>.<\/li>
<li>Las del músculo papilar posterior se dirigen a la <strong>mitad inferior de ambas valvas<\/strong>.<\/li>
<\/ul>
<p>Rouvière describe las cuerdas mitrales como más numerosas y resistentes que las de la válvula atrioventricular derecha.<\/p>
<h2>6. Cuerdas tendinosas<\/h2>
<p>Según su inserción:<\/p>
<ol>
<li><strong>Primer orden:<\/strong> borde adherente.<\/li>
<li><strong>Segundo orden:<\/strong> cara parietal.<\/li>
<li><strong>Tercer orden:<\/strong> borde libre.<\/li>
<\/ol>
<h3>Particularidad de la mitral<\/h3>
<ul>
<li><strong>Valva anterior:<\/strong> cuerdas de tercer orden fijadas al borde libre.<\/li>
<li><strong>Valva posterior:<\/strong> cuerdas distribuidas sobre la cara parietal hasta proximidades del borde adherente.<\/li>
<\/ul>
<blockquote>
<p><strong>La bibliografía oficial no establece un número total fijo de cuerdas para cada valva.<\/strong><\/p>
<\/blockquote>
<h2>7. Septo interventricular<\/h2>
<blockquote>
<p><strong>La pared medial del ventrículo izquierdo corresponde al septo interventricular, formado por una porción muscular extensa y una pequeña porción membranosa. Sobre su cara izquierda se relaciona con la rama izquierda del fascículo atrioventricular.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> su formación es compleja y reúne componentes musculares y membranosos de distinto origen; la bibliografía oficial no permite atribuir toda la porción membranosa a un único componente embrionario.<\/p>
<h2>8. Válvula aórtica<\/h2>
<blockquote>
<p><strong>El orificio aórtico se sitúa anterosuperiormente y a la derecha del orificio atrioventricular izquierdo. Está provisto de tres valvas semilunares: posterior, derecha e izquierda.<\/strong><\/p>
<\/blockquote>
<ul>
<li>Durante la <strong>sístole<\/strong>, permite el paso de sangre desde el ventrículo izquierdo hacia la aorta.<\/li>
<li>Durante la <strong>diástole<\/strong>, el cierre de las valvas impide el retorno hacia el ventrículo.<\/li>
<li>Los senos aórticos derecho e izquierdo se relacionan con los orificios de las arterias coronarias derecha e izquierda.<\/li>
<\/ul>
<p><strong>Embriología:<\/strong> las valvas semilunares se desarrollan durante la tabicación de la vía de salida y la separación de los conductos aórtico y pulmonar.<\/p>
<h2>9. Cámara de entrada<\/h2>
<blockquote>
<p><strong>La cámara de entrada se sitúa posteroinferiormente y hacia la izquierda respecto de la cámara de salida. Se relaciona con el orificio atrioventricular izquierdo y está limitada anteromedialmente por la valva anterior de la mitral.<\/strong><\/p>
<\/blockquote>
<p><strong>Embriología:<\/strong> la bibliografía oficial <strong>no individualiza un origen embrionario propio de esta cámara adulta<\/strong>.<\/p>
<h2>10. Cámara de salida<\/h2>
<blockquote>
<p><strong>La cámara de salida es un conducto estrecho situado anterosuperiormente y hacia la derecha respecto de la cámara de entrada, entre la valva anterior de la mitral y el septo interventricular. Termina en el orificio aórtico.<\/strong><\/p>
<\/blockquote>
<p>Durante la sístole la sangre progresa por esta cámara hacia la aorta.<\/p>
<p><strong>Embriología:<\/strong> la bibliografía oficial describe la morfogénesis global de la vía de salida, pero <strong>no individualiza un origen embrionario propio de esta cámara adulta<\/strong>.<\/p>
<h2>11. Comparación con el ventrículo derecho<\/h2>
<blockquote>
<p><strong>Rouvière describe para el ventrículo izquierdo una pared de aproximadamente 1 cm, frente a aproximadamente 5 mm en el ventrículo derecho. La circulación sistémica trabaja a presiones mayores que la circulación pulmonar.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El ventrículo izquierdo es cónico, de sección aproximadamente circular y paredes gruesas. El orificio atrioventricular izquierdo posee la válvula mitral, formada por valvas anterior y posterior, cuerdas tendinosas y músculos papilares anterior y posterior. Ambos músculos papilares envían cuerdas a las dos valvas. La valva anterior se sitúa anteromedialmente, separa las cámaras de entrada y salida y recibe cuerdas en su borde libre; la posterior se sitúa posterolateralmente y recibe numerosas cuerdas sobre su cara parietal. La pared medial corresponde al septo interventricular. La cámara de entrada es posteroinferior y la cámara de salida es anterosuperior, entre la valva anterior y el septo. Esta última termina en la válvula aórtica, formada por valvas semilunares posterior, derecha e izquierda.<\/strong><\/p>

<h2>1. Comparación derecha e izquierda<\/h2>
<h3>Corazón derecho<\/h3>
<ul>
<li>Recibe el retorno venoso sistémico.<\/li>
<li>Envía sangre hacia la circulación pulmonar.<\/li>
<li>El ventrículo derecho posee paredes de aproximadamente <strong>5 mm<\/strong> según Rouvière.<\/li>
<\/ul>
<h3>Corazón izquierdo<\/h3>
<ul>
<li>Recibe el retorno de las venas pulmonares.<\/li>
<li>Envía sangre hacia la circulación sistémica.<\/li>
<li>El ventrículo izquierdo posee paredes de aproximadamente <strong>1 cm<\/strong> según Rouvière.<\/li>
<\/ul>
<blockquote>
<p><strong>La pared ventricular izquierda es, por lo tanto, considerablemente más gruesa que la derecha. Latarjet señala además que la presión de la circulación sistémica es muy superior a la presión de la circulación pulmonar.<\/strong><\/p>
<\/blockquote>
<h2>2. Circulación fetal y foramen oval<\/h2>
<blockquote>
<p><strong>Durante la vida fetal, la corriente sanguínea atraviesa el foramen oval desde el atrio derecho hacia el atrio izquierdo. El septum primum constituye el componente valvular que permite este pasaje unidireccional fetal.<\/strong><\/p>
<\/blockquote>
<h2>3. Cierre al nacimiento<\/h2>
<blockquote>
<p><strong>Al establecerse la respiración pulmonar, la presión del atrio izquierdo supera a la del atrio derecho. La prolongación del septum primum se aplica entonces contra la cara izquierda del septum secundum y produce el cierre funcional del foramen oval. Posteriormente puede producirse la unión anatómica de ambos componentes.<\/strong><\/p>
<\/blockquote>
<h3>Aclaración importante<\/h3>
<blockquote>
<p><strong>El corazón no comienza a latir con la primera respiración: ya posee actividad durante la vida fetal. Lo que cambia al nacimiento es el régimen circulatorio y el gradiente de presión entre ambos atrios.<\/strong><\/p>
<\/blockquote>
<p>La bibliografía anatómica oficial utilizada establece como mecanismo inmediato del cierre el cambio de presión <strong>atrio izquierdo &gt; atrio derecho<\/strong> al iniciarse la respiración pulmonar. No desarrolla en este apartado una explicación fisiológica detallada de todos los cambios de resistencia vascular neonatal, por lo que no se agregan mecanismos no explicitados por estas fuentes.<\/p>
<h2>Speech<\/h2>
<blockquote>
<p><strong>El corazón derecho recibe el retorno sistémico y lo impulsa hacia la circulación pulmonar, mientras que el corazón izquierdo recibe el retorno pulmonar y lo impulsa hacia la circulación sistémica. Rouvière describe aproximadamente 5 mm de espesor para las paredes del ventrículo derecho y 1 cm para las del izquierdo. Durante la vida fetal existe un pasaje de derecha a izquierda a través del foramen oval. Al nacimiento, cuando se establece la respiración pulmonar, la presión del atrio izquierdo supera a la del derecho; el septum primum se aplica contra el septum secundum y produce el cierre funcional del foramen oval.<\/strong><\/p>
<\/blockquote>

<h2>Speech<\/h2>
<blockquote>
<p><strong>La circulación sanguínea por las cavidades cardíacas comienza con el retorno venoso sistémico, que alcanza el atrio derecho principalmente por las venas cavas superior e inferior y por el seno coronario. Desde el atrio derecho la sangre atraviesa el orificio atrioventricular derecho y la válvula tricúspide e ingresa al ventrículo derecho. Recorre su cámara de entrada y luego su cámara de salida o cono arterioso, atraviesa la válvula pulmonar y pasa al tronco pulmonar.<\/strong><\/p>
<p><strong>El tronco pulmonar se divide en las arterias pulmonares derecha e izquierda, que conducen la sangre hacia los pulmones, donde se realiza la hematosis. La sangre oxigenada retorna por las cuatro venas pulmonares al atrio izquierdo. Desde allí atraviesa el orificio atrioventricular izquierdo y la válvula mitral hacia el ventrículo izquierdo. Recorre la cámara de entrada y luego la cámara de salida aórtica, atraviesa la válvula aórtica y pasa a la aorta, que la distribuye por la circulación sistémica. Finalmente, el retorno venoso sistémico vuelve nuevamente al atrio derecho, completando el circuito.<\/strong><\/p>
<\/blockquote>
<h2>Cadena rápida<\/h2>
<p><strong>VCS + VCI + seno coronario → atrio derecho → tricúspide → ventrículo derecho → válvula pulmonar → tronco pulmonar → arterias pulmonares → pulmones → venas pulmonares → atrio izquierdo → mitral → ventrículo izquierdo → válvula aórtica → aorta → circulación sistémica → venas cavas → atrio derecho.<\/strong><\/p>
<h2>Dos circuitos<\/h2>
<h3>Circulación pulmonar o menor<\/h3>
<p><strong>Ventrículo derecho → tronco pulmonar → arterias pulmonares → pulmones → venas pulmonares → atrio izquierdo.<\/strong><\/p>
<h3>Circulación sistémica o mayor<\/h3>
<p><strong>Ventrículo izquierdo → aorta → tejidos → sistema venoso → venas cavas → atrio derecho.<\/strong><\/p>
<h2>Punto útil para oral<\/h2>
<p>Las arterias y venas se denominan según la dirección del flujo respecto del corazón, no según su contenido de oxígeno. Por eso:<\/p>
<ul>
<li>Las <strong>arterias pulmonares<\/strong> llevan sangre no oxigenada desde el corazón hacia los pulmones.<\/li>
<li>Las <strong>venas pulmonares<\/strong> llevan sangre oxigenada desde los pulmones hacia el corazón.<\/li>
<\/ul>

<h2>Programa<\/h2>
<p>El programa exige:<\/p>
<ul>
<li>Arteria coronaria derecha.<\/li>
<li>Arteria interventricular posterior.<\/li>
<li>Rama del nodo sinoatrial.<\/li>
<li>Rama del nodo atrioventricular.<\/li>
<li>Ramas interventriculares septales posteriores.<\/li>
<li>Rama marginal derecha.<\/li>
<li>Arteria coronaria izquierda.<\/li>
<li>Arteria interventricular anterior.<\/li>
<li>Arteria circunfleja.<\/li>
<li>Ramas diagonales.<\/li>
<li>Ramas interventriculares septales anteriores.<\/li>
<li>Rama marginal izquierda.<\/li>
<li>Territorio de irrigación de cada coronaria.<\/li>
<li>Irrigación del sistema de conducción.<\/li>
<\/ul>
<h2>1. Concepto general<\/h2>
<blockquote>
<p><strong>La irrigación arterial del corazón está dada por dos arterias coronarias, derecha e izquierda, ramas de la aorta ascendente. Se disponen alrededor del corazón siguiendo principalmente el surco coronario y los surcos interventriculares.<\/strong><\/p>
<\/blockquote>
<h1>Coronaria derecha<\/h1>
<h2>2. Origen y trayecto<\/h2>
<blockquote>
<p><strong>La arteria coronaria derecha nace de la aorta a nivel del seno aórtico derecho. Se dirige inferior, anterior y lateralmente hacia la derecha, recorre la porción derecha del surco coronario y alcanza la cara inferior del corazón. En la disposición habitual continúa como rama interventricular posterior.<\/strong><\/p>
<\/blockquote>
<p>Su trayecto puede describirse en tres segmentos:<\/p>
<ol>
<li><strong>Preatrial.<\/strong><\/li>
<li><strong>Infraatrial.<\/strong><\/li>
<li><strong>Interventricular posterior.<\/strong><\/li>
<\/ol>
<h2>3. Ramas principales<\/h2>
<ul>
<li><strong>Rama del nodo sinoatrial:<\/strong> habitualmente rama atrial de la coronaria derecha, aunque puede originarse en la izquierda.<\/li>
<li><strong>Rama marginal derecha:<\/strong> se dirige hacia el borde derecho e irriga principalmente el ventrículo derecho.<\/li>
<li><strong>Rama del nodo atrioventricular:<\/strong> participa en la irrigación del nodo AV y del fascículo atrioventricular.<\/li>
<li><strong>Rama interventricular posterior:<\/strong> recorre el surco interventricular posterior.<\/li>
<li><strong>Ramas interventriculares septales posteriores:<\/strong> penetran el septo interventricular.<\/li>
<\/ul>
<h3>Speech<\/h3>
<blockquote>
<p><strong>La coronaria derecha nace del seno aórtico derecho, recorre el surco coronario derecho y alcanza la cara inferior. Entre sus ramas principales se encuentran la rama del nodo sinoatrial, la marginal derecha, la rama del nodo atrioventricular, la interventricular posterior y las ramas interventriculares septales posteriores.<\/strong><\/p>
<\/blockquote>
<h1>Coronaria izquierda<\/h1>
<h2>4. Origen y división<\/h2>
<blockquote>
<p><strong>La coronaria izquierda nace de la aorta a nivel del seno aórtico izquierdo. Pasa posterior al tronco pulmonar, luego hacia su lado izquierdo y queda parcialmente cubierta por la orejuela izquierda. Después de un trayecto corto se divide en dos ramas terminales principales: interventricular anterior y circunfleja.<\/strong><\/p>
<\/blockquote>
<h2>5. Rama interventricular anterior<\/h2>
<p>Recorre el <strong>surco interventricular anterior<\/strong> hacia el vértice.<\/p>
<p>Da principalmente:<\/p>
<ul>
<li>ramas ventriculares;<\/li>
<li><strong>ramas diagonales<\/strong>;<\/li>
<li><strong>ramas interventriculares septales anteriores<\/strong>.<\/li>
<\/ul>
<p>Estas últimas irrigan principalmente los <strong>dos tercios anteriores del septo interventricular<\/strong>.<\/p>
<h2>6. Rama circunfleja<\/h2>
<p>Recorre la porción izquierda del <strong>surco coronario<\/strong> hacia la cara inferior.<\/p>
<p>Da ramas atriales y ventriculares, entre ellas la:<\/p>
<ul>
<li><strong>rama marginal izquierda<\/strong>, destinada a la pared lateral del ventrículo izquierdo.<\/li>
<\/ul>
<h3>Speech<\/h3>
<blockquote>
<p><strong>La coronaria izquierda nace del seno aórtico izquierdo y se divide en interventricular anterior y circunfleja. La interventricular anterior recorre el surco interventricular anterior y da ramas diagonales y septales anteriores. La circunfleja recorre el surco coronario izquierdo y da, entre otras, la marginal izquierda.<\/strong><\/p>
<\/blockquote>
<h1>7. Territorios coronarios<\/h1>
<h2>Coronaria derecha<\/h2>
<p>Irriga principalmente:<\/p>
<ul>
<li>atrio derecho;<\/li>
<li>gran parte del ventrículo derecho;<\/li>
<li>parte de la cara inferior del ventrículo izquierdo;<\/li>
<li><strong>tercio posterior del septo interventricular<\/strong>;<\/li>
<li>con mayor frecuencia, componentes proximales del sistema de conducción.<\/li>
<\/ul>
<h2>Coronaria izquierda<\/h2>
<p>Irriga principalmente:<\/p>
<ul>
<li>atrio izquierdo;<\/li>
<li>parte variable del atrio derecho;<\/li>
<li>mayor parte del ventrículo izquierdo;<\/li>
<li>parte anterior del ventrículo derecho;<\/li>
<li><strong>dos tercios anteriores del septo interventricular<\/strong>.<\/li>
<\/ul>
<h3>Regla mental<\/h3>
<p><strong>Derecha → corazón derecho + cara inferior + 1/3 posterior del septo.<\/strong><\/p>
<p><strong>Izquierda → mayor parte del VI + cara anterior + 2/3 anteriores del septo.<\/strong><\/p>
<h1>8. Irrigación del sistema de conducción<\/h1>
<ul>
<li><strong>Nodo sinoatrial:<\/strong> habitualmente irrigado por una rama de la coronaria derecha, aunque puede provenir de la izquierda.<\/li>
<li><strong>Nodo atrioventricular y fascículo atrioventricular:<\/strong> habitualmente irrigados por ramas septales posteriores, generalmente dependientes de la coronaria derecha.<\/li>
<li><strong>Rama derecha del fascículo AV:<\/strong> recibe irrigación de ramas septales anteriores.<\/li>
<li><strong>Rama izquierda del fascículo AV:<\/strong> irrigada por ramas interventriculares septales anteriores de la coronaria izquierda.<\/li>
<\/ul>
<h1>9. Dominancia coronaria<\/h1>
<blockquote>
<p><strong>La dominancia coronaria se define por cuál arteria coronaria origina la rama interventricular posterior.<\/strong><\/p>
<\/blockquote>
<ul>
<li><strong>Dominancia derecha:<\/strong> la rama interventricular posterior nace de la <strong>coronaria derecha<\/strong>.<\/li>
<li><strong>Dominancia izquierda:<\/strong> nace de la <strong>rama circunfleja de la coronaria izquierda<\/strong>.<\/li>
<li><strong>Codominancia:<\/strong> ambas coronarias participan en la vascularización posterior.<\/li>
<\/ul>
<p>La disposición descrita habitualmente por Latarjet y Rouvière es la continuación de la coronaria derecha como rama interventricular posterior, pero no debe tomarse como una regla absoluta.<\/p>
<h3>Consecuencia anatómica<\/h3>
<p>La dominancia modifica qué coronaria aporta gran parte de la irrigación de la <strong>cara inferior<\/strong> y del <strong>territorio posterior del septo interventricular<\/strong>.<\/p>
<h3>Speech<\/h3>
<blockquote>
<p><strong>Debe considerarse además la dominancia coronaria, determinada por el origen de la rama interventricular posterior. Es derecha cuando esta rama depende de la coronaria derecha, izquierda cuando depende de la circunfleja de la coronaria izquierda y puede existir codominancia cuando ambas participan en la irrigación posterior.<\/strong><\/p>
<\/blockquote>
<h1>10. Reparos de la cara inferior<\/h1>
<p>En la cara inferior es útil reconocer la <strong>cruz formada por el surco coronario con los surcos interatrial e interventricular posterior<\/strong>. Latarjet utiliza esta región como reparo para describir las variaciones de extensión de las coronarias y la transición de la vena cardíaca magna hacia el seno coronario.<\/p>
<h1>Speech integrado<\/h1>
<blockquote>
<p><strong>La irrigación del corazón depende de las arterias coronarias derecha e izquierda, ramas de la aorta ascendente. La coronaria derecha nace del seno aórtico derecho, recorre el surco coronario y alcanza la cara inferior; da, entre otras, la rama del nodo sinoatrial, la marginal derecha, la rama del nodo atrioventricular, la interventricular posterior y ramas septales posteriores. Irriga principalmente el atrio derecho, gran parte del ventrículo derecho, parte de la cara inferior del ventrículo izquierdo y el tercio posterior del septo interventricular.<\/strong><\/p>
<p><strong>La coronaria izquierda nace del seno aórtico izquierdo y se divide en interventricular anterior y circunfleja. La interventricular anterior da ramas diagonales y septales anteriores; la circunfleja recorre el surco coronario izquierdo y da la marginal izquierda. Irriga el atrio izquierdo, la mayor parte del ventrículo izquierdo, parte del ventrículo derecho y los dos tercios anteriores del septo. La dominancia coronaria se define por el origen de la rama interventricular posterior: es derecha si depende de la coronaria derecha, izquierda si depende de la circunfleja y puede existir codominancia.<\/strong><\/p>
<\/blockquote>

<h2>Programa<\/h2>
<blockquote>
<p><strong>Retorno venoso del corazón: venas cardíacas y seno coronario.<\/strong><\/p>
<\/blockquote>
<h2>1. Organización general<\/h2>
<blockquote>
<p><strong>El drenaje venoso cardíaco no reproduce exactamente el trayecto de las arterias. Se reconoce un sistema principal que converge en el seno coronario y venas que desembocan directamente en las cavidades cardíacas.<\/strong><\/p>
<\/blockquote>
<h2>2. Vena cardíaca magna<\/h2>
<blockquote>
<p><strong>Se inicia en la región del vértice como vena interventricular anterior. Asciende por el surco interventricular anterior, se dirige luego hacia la izquierda y continúa por el surco coronario como vena cardíaca magna.<\/strong><\/p>
<\/blockquote>
<p>Recibe tributarias procedentes de:<\/p>
<ul>
<li>septo interventricular;<\/li>
<li>paredes anteriores de ambos ventrículos;<\/li>
<li>pared lateral del ventrículo izquierdo;<\/li>
<li>atrio izquierdo.<\/li>
<\/ul>
<h2>3. Seno coronario<\/h2>
<blockquote>
<p><strong>La vena cardíaca magna aumenta de calibre en su segmento terminal y continúa con el seno coronario, situado en la cara inferior y posterior del corazón, en relación con el surco coronario. El seno coronario mide aproximadamente 3 cm y desemboca en el atrio derecho.<\/strong><\/p>
<\/blockquote>
<p>Entre sus afluentes principales se describen:<\/p>
<ul>
<li>vena cardíaca magna;<\/li>
<li>vena oblicua del atrio izquierdo;<\/li>
<li>vena posterior del ventrículo izquierdo;<\/li>
<li>vena cardíaca media;<\/li>
<li>vena cardíaca menor.<\/li>
<\/ul>
<h2>4. Vena cardíaca media<\/h2>
<blockquote>
<p><strong>La vena cardíaca media recorre el surco interventricular posterior y termina en el seno coronario.<\/strong><\/p>
<\/blockquote>
<p>También puede encontrarse descrita como <strong>vena interventricular posterior<\/strong>.<\/p>
<h2>5. Vena cardíaca menor<\/h2>
<blockquote>
<p><strong>Se relaciona con el borde derecho y con la porción derecha del surco coronario y puede desembocar en el segmento terminal del seno coronario.<\/strong><\/p>
<\/blockquote>
<h2>6. Venas cardíacas anteriores<\/h2>
<blockquote>
<p><strong>Proceden principalmente de la porción anterior y derecha del ventrículo derecho y desembocan directamente en el atrio derecho, sin pasar por el seno coronario.<\/strong><\/p>
<\/blockquote>
<p>Una de las más importantes es la <strong>vena marginal derecha<\/strong>.<\/p>
<h2>7. Venas cardíacas mínimas<\/h2>
<blockquote>
<p><strong>Son pequeñas venas que se originan en las paredes cardíacas y se abren directamente en las cavidades vecinas mediante pequeños orificios. Son especialmente numerosas en las paredes atriales y en los músculos papilares.<\/strong><\/p>
<\/blockquote>
<h2>8. Embriología del seno coronario<\/h2>
<blockquote>
<p><strong>Rouvière describe al seno coronario como un derivado del segmento terminal de la vena cava superior izquierda embrionaria que involuciona durante el desarrollo.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El retorno venoso del corazón comprende un sistema principal que converge en el seno coronario y venas que drenan directamente en las cavidades. La vena interventricular anterior se origina próxima al vértice, asciende por el surco interventricular anterior y continúa como vena cardíaca magna en el surco coronario. Su segmento terminal dilatado forma el seno coronario, de aproximadamente 3 cm, que desemboca en el atrio derecho. El seno recibe principalmente la vena cardíaca magna, la vena oblicua del atrio izquierdo, la vena posterior del ventrículo izquierdo, la vena cardíaca media y la vena cardíaca menor. Las venas cardíacas anteriores drenan directamente en el atrio derecho y las venas cardíacas mínimas se abren directamente en las cavidades cardíacas.<\/strong><\/p>
<\/blockquote>

<h2>Programa<\/h2>
<ul>
<li>Concepto.<\/li>
<li>Nodo sinoatrial: ubicación y relaciones.<\/li>
<li>Vías internodales.<\/li>
<li>Nodo atrioventricular: ubicación y relaciones.<\/li>
<li>Fascículo atrioventricular.<\/li>
<li>Rama derecha.<\/li>
<li>Rama izquierda y sus divisiones anterior y posterior.<\/li>
<li>Ramos subendocárdicos.<\/li>
<li>Papel funcional.<\/li>
<\/ul>
<h2>1. Concepto<\/h2>
<blockquote>
<p><strong>El sistema de conducción del corazón está constituido por células miocárdicas especializadas que generan y transmiten la despolarización cardíaca.<\/strong><\/p>
<\/blockquote>
<p>El corazón posee automatismo intrínseco: Latarjet señala que puede continuar latiendo separado de sus conexiones nerviosas extrínsecas.<\/p>
<h2>2. Componentes<\/h2>
<ul>
<li>nodo sinoatrial;<\/li>
<li>nodo atrioventricular;<\/li>
<li>fascículo atrioventricular;<\/li>
<li>rama derecha;<\/li>
<li>rama izquierda;<\/li>
<li>ramos subendocárdicos.<\/li>
<\/ul>
<h2>3. Nodo sinoatrial<\/h2>
<blockquote>
<p><strong>Se sitúa en la pared del atrio derecho, en la porción sinusal, próximo al orificio de la vena cava superior y relacionado con la cresta terminal. Su extremo superior es anteroderecho respecto del orificio de la vena cava superior y desciende por la región interna de la cresta terminal.<\/strong><\/p>
<\/blockquote>
<h3>Función<\/h3>
<blockquote>
<p><strong>Es el centro excitoconductor primario del corazón en condiciones normales.<\/strong><\/p>
<\/blockquote>
<h2>4. Vías internodales<\/h2>
<blockquote>
<p><strong>El programa solicita su estudio, pero Latarjet aclara que las vías internodales e interatriales descritas clásicamente no se consideran actualmente fascículos constituidos por tejido miocárdico especializado anatómicamente diferenciado.<\/strong><\/p>
<\/blockquote>
<h2>5. Nodo atrioventricular<\/h2>
<blockquote>
<p><strong>Se sitúa en la pared del atrio derecho, en el septo atrioventricular, dentro de una región triangular.<\/strong><\/p>
<\/blockquote>
<p>Límites de esa región:<\/p>
<ul>
<li><strong>posterior:<\/strong> orificio del seno coronario;<\/li>
<li><strong>inferolateral:<\/strong> inserción de la valva septal de la válvula tricúspide;<\/li>
<li><strong>medial:<\/strong> tendón de la válvula de la vena cava inferior.<\/li>
<\/ul>
<p>Esta región triangular suele denominarse <strong>[epónimo: triángulo de Koch]<\/strong>.<\/p>
<h2>6. Fascículo atrioventricular<\/h2>
<blockquote>
<p><strong>Parte del nodo atrioventricular, se dirige anterosuperiormente y hacia la izquierda, alcanza la porción membranosa del septo interventricular y finalmente se divide en ramas derecha e izquierda.<\/strong><\/p>
<\/blockquote>
<p>El fascículo atrioventricular también se encuentra en bibliografía clásica como <strong>[epónimo: haz de His]<\/strong>.<\/p>
<h2>7. Rama derecha<\/h2>
<blockquote>
<p><strong>Se dirige anteriormente sobre la cara derecha del septo interventricular, penetra en la trabécula septomarginal y alcanza la base de los músculos papilares del ventrículo derecho.<\/strong><\/p>
<\/blockquote>
<h2>8. Rama izquierda<\/h2>
<blockquote>
<p><strong>Alcanza la cara izquierda del septo interventricular, pasa en relación con el intervalo entre las valvas semilunares aórticas derecha y posterior y luego se divide en grupos anterior y posterior.<\/strong><\/p>
<\/blockquote>
<p>Estas divisiones se distribuyen hacia las regiones de los músculos papilares anterior y posterior del ventrículo izquierdo.<\/p>
<h2>9. Ramos subendocárdicos<\/h2>
<blockquote>
<p><strong>Las ramas derecha e izquierda se dividen en numerosas ramificaciones subendocárdicas que forman una red de amplias mallas sobre las paredes ventriculares y los músculos papilares.<\/strong><\/p>
<\/blockquote>
<p>La denominación clásica <strong>[epónimo: fibras o red de Purkinje]<\/strong> corresponde a estos ramos subendocárdicos.<\/p>
<h2>10. Irrigación<\/h2>
<ul>
<li><strong>Nodo sinoatrial:<\/strong> recibe generalmente una rama procedente de la coronaria derecha, aunque puede proceder de la izquierda.<\/li>
<li><strong>Nodo atrioventricular y fascículo atrioventricular:<\/strong> reciben habitualmente la primera rama interventricular septal posterior.<\/li>
<li><strong>Rama derecha:<\/strong> recibe aporte de ramas interventriculares septales anteriores.<\/li>
<li><strong>Rama izquierda:<\/strong> recibe ramas interventriculares septales anteriores de la coronaria izquierda.<\/li>
<\/ul>
<h2>11. Papel funcional<\/h2>
<blockquote>
<p><strong>El impulso se inicia normalmente en el nodo sinoatrial, se propaga por el miocardio atrial hacia el nodo atrioventricular y continúa por el fascículo atrioventricular, sus ramas derecha e izquierda y los ramos subendocárdicos, coordinando la activación ventricular.<\/strong><\/p>
<\/blockquote>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>El sistema de conducción del corazón está formado por células miocárdicas especializadas y comprende nodo sinoatrial, nodo atrioventricular, fascículo atrioventricular, ramas derecha e izquierda y ramos subendocárdicos. El nodo sinoatrial se sitúa en la pared del atrio derecho, próximo a la vena cava superior y relacionado con la cresta terminal. Latarjet aclara que las vías internodales clásicas no constituyen fascículos especializados anatómicamente diferenciados. El nodo atrioventricular se encuentra en una región triangular limitada por el orificio del seno coronario, la inserción de la valva septal tricuspídea y el tendón de la válvula de la vena cava inferior. Desde allí parte el fascículo atrioventricular, que alcanza la porción membranosa del septo y se divide en una rama derecha, relacionada con la trabécula septomarginal, y una rama izquierda, que se divide en grupos anterior y posterior. Ambas terminan en ramos subendocárdicos distribuidos por el miocardio ventricular.<\/strong><\/p>
<\/blockquote>

", "images": ["13_Sistema_de_conduccion/01_nodo_sinoatrial__video_16__00-02-42.jpg", "13_Sistema_de_conduccion/02_nodo_atrioventricular_y_reparos__video_16__00-04-06.jpg", "13_Sistema_de_conduccion/03_vias_internodales_clasicas_NO_fasciculos_especializados__video_16__00-04-42.jpg", "13_Sistema_de_conduccion/04_fasciculo_atrioventricular_y_ramas__video_16__00-05-20.jpg", "13_Sistema_de_conduccion/05_sistema_cardionector_integrado_y_red_subendocardica__video_16__00-05-30.jpg"]}, {"id": "14_Inervacion_extrinseca_y_plexo", "number": 14, "title": "Inervación extrínseca y plexo cardíaco", "md_file": "14_Inervacion_extrinseca_y_plexo/Inervacion_extrinseca_y_plexo_cardiaco.md", "html": "<h1>Inervación extrínseca y plexo cardíaco<\/h1>
<h2>Programa<\/h2>
<blockquote>
<p><strong>Inervación extrínseca del corazón: origen y comportamiento de las fibras simpáticas y parasimpáticas.<\/strong><\/p>
<\/blockquote>
<h2>1. Concepto<\/h2>
<blockquote>
<p><strong>La inervación extrínseca del corazón pertenece al sistema nervioso autónomo. Los ramos cardíacos simpáticos y parasimpáticos se comunican alrededor de los grandes vasos y forman el plexo cardíaco.<\/strong><\/p>
<\/blockquote>
<p>Esta inervación <strong>modula<\/strong> la actividad cardíaca, pero no constituye el origen del automatismo, que depende del sistema de conducción intrínseco.<\/p>
<h2>2. Ramos cardíacos simpáticos<\/h2>
<p>Según Latarjet y Rouvière, los nervios cardíacos simpáticos que forman el plexo se describen procedentes de los ganglios cervicales del tronco simpático:<\/p>
<ul>
<li>cervical superior;<\/li>
<li>cervical medio;<\/li>
<li>cervical inferior o cervicotorácico.<\/li>
<\/ul>
<p>Los ramos superiores y medios siguen relaciones próximas a los ejes carotídeos y alcanzan el plexo en relación posterior con la aorta. El ramo inferior es más corto y posterior.<\/p>
<blockquote>
<p><strong>Rouvière señala expresamente que, en su descripción del plexo cardíaco, estos ramos simpáticos proceden de los ganglios cervicales y no de los ganglios torácicos superiores.<\/strong><\/p>
<\/blockquote>
<h2>3. Ramos cardíacos parasimpáticos<\/h2>
<p>Proceden del <strong>nervio vago<\/strong>.<\/p>
<p>Latarjet distingue:<\/p>
<ul>
<li>ramos cardíacos cervicales superiores;<\/li>
<li>ramos cardíacos cervicales inferiores;<\/li>
<li>ramos cardíacos torácicos.<\/li>
<\/ul>
<p>Los superiores nacen del vago cervical. Los inferiores y torácicos pueden proceder del vago intratorácico o del nervio laríngeo recurrente según el lado y el nivel.<\/p>
<h2>4. Formación del plexo cardíaco<\/h2>
<blockquote>
<p><strong>Al alcanzar la región del arco aórtico, los ramos cardíacos simpáticos y vagales se comunican ampliamente.<\/strong><\/p>
<\/blockquote>
<p>Clásicamente se describen:<\/p>
<h3>Plexo superficial o anterior<\/h3>
<p>Se dispone principalmente <strong>anterior al arco aórtico<\/strong>.<\/p>
<h3>Plexo profundo o posterior<\/h3>
<p>Es más extenso y se dispone <strong>posterior al arco aórtico y anterior a la tráquea<\/strong>.<\/p>
<p>Ambos se comunican mediante ramos que pasan <strong>inferiormente al arco aórtico<\/strong>.<\/p>
<h2>5. Distribución hacia el corazón<\/h2>
<p>Latarjet agrupa los nervios que parten de estos plexos en relación con dos raíces vasculares:<\/p>
<h3>Nervios de la raíz arterial<\/h3>
<p>Se distribuyen alrededor de:<\/p>
<ul>
<li>aorta;<\/li>
<li>tronco pulmonar;<\/li>
<li>arterias coronarias, donde forman plexos pericoronarios.<\/li>
<\/ul>
<h3>Nervios de la raíz venosa<\/h3>
<p>Pasan <strong>posteriores a la bifurcación del tronco pulmonar<\/strong> y alcanzan:<\/p>
<ul>
<li>atrio izquierdo;<\/li>
<li>atrio derecho;<\/li>
<li>cara inferior de los ventrículos;<\/li>
<li>región de la vena cava inferior.<\/li>
<\/ul>
<h2>6. Distribución intracardíaca<\/h2>
<p>Los ramos forman:<\/p>
<ul>
<li>red subepicárdica;<\/li>
<li>redes intramiocárdicas;<\/li>
<li>red subendocárdica.<\/li>
<\/ul>
<h2>7. Cardionector vs. plexo cardíaco<\/h2>
<p>| Sistema de conducción | Plexo cardíaco |
|---|---|
| Intrínseco | Extrínseco |
| Miocardio especializado | Fibras autónomas simpáticas y vagales |
| Genera y conduce la actividad eléctrica | Modula la actividad cardíaca |
| Nodo sinoatrial, nodo atrioventricular, fascículo, ramas y ramos subendocárdicos | Ramos cardíacos simpáticos y parasimpáticos |<\/p>
<h2>Speech integrado<\/h2>
<blockquote>
<p><strong>La inervación extrínseca del corazón depende de fibras simpáticas y parasimpáticas. Los ramos simpáticos cardíacos descritos por Latarjet y Rouvière proceden de los ganglios cervicales superior, medio e inferior del tronco simpático. Los ramos parasimpáticos proceden del nervio vago y comprenden ramos cervicales y torácicos. En la región del arco aórtico ambos sistemas se comunican y forman un plexo cardíaco superficial o anterior y otro profundo o posterior. Desde ellos parten nervios relacionados con la raíz arterial, que siguen a la aorta, al tronco pulmonar y a las coronarias, y nervios relacionados con la raíz venosa, que alcanzan los atrios y la cara inferior ventricular. Esta inervación es extrínseca y moduladora; el automatismo cardíaco depende del sistema de conducción intrínseco.<\/strong><\/p>
<\/blockquote>
